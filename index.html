<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F2420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0F2420;
  --surface:#16302A;
  --surface-2:#1C3B34;
  --line:#2B5247;
  --ink:#EAF2EB;
  --ink-2:#9AB4A8;
  --ink-3:#6C8A7E;
  --good:#8ED6A9;
  --warn:#E9B45A;
  --bad:#E97D63;
  --on-accent:#0C2019;
  --on-warn:#231602;
  --tabbg:#0F2420EB;
  --scrim:rgba(6,16,14,.62);
  --shadow:rgba(0,0,0,.45);
  --radius:14px;
  --gut:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* On iPhone the app runs edge to edge: content stays clear of the status bar,
   the notch and the home indicator. */
#app{max-width:540px;margin:0 auto;padding:0 max(var(--gut),env(safe-area-inset-right)) 0 max(var(--gut),env(safe-area-inset-left))}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--good);outline-offset:1px;border-color:transparent}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.hidden{display:none!important}

/* Month header */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,transparent);padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:6px}
.topbar h1{font-size:19px;flex:1;text-align:center;text-transform:capitalize}
.navbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:19px;border:1px solid var(--line)}
.navbtn:active{background:var(--surface)}
.navbtn[disabled]{opacity:.3}

/* Month summary card */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;margin-bottom:14px}
.hero .label{font-size:13.5px;color:var(--ink-2)}
.hero .amount{font-size:52px;line-height:1.05;margin:4px 0 2px;display:block}
.hero .sub{font-size:13.5px;color:var(--ink-2)}
.pace{margin-top:18px}
.pace .rail{position:relative;height:10px;border-radius:6px;background:var(--surface-2);overflow:visible;border:1px solid var(--line)}
.pace .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--good);transition:width .35s ease}
.pace .today{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.pace .today::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.pace .cap{margin-top:9px;font-size:13px;color:var(--ink-2)}
.split{display:flex;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.split div{flex:1}
.split .k{font-size:12.5px;color:var(--ink-3)}
.split .v{font-size:16px;margin-top:1px}

/* Envelopes, expenses and lists */
section{margin-bottom:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 9px}
.sechead h2{font-size:17px}
.sechead button{font-size:13px;color:var(--good)}

.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:8px;font-size:13.5px}
.alert.over{border-left-color:var(--bad)}
.alert .ico{font-size:15px;line-height:1.3}

.env{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:none}
.env .row1{display:flex;align-items:baseline;gap:9px}
.env .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env .amt{font-size:14px}
.env .rail{height:5px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.env .fill{height:100%;border-radius:3px;background:var(--good)}
.env .sub{font-size:12.5px;color:var(--ink-3);margin-top:5px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}

.exp{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left}
.exp:last-child{border-bottom:none}
.exp .em{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px}
.exp .mid{flex:1;min-width:0}
.exp .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .s{font-size:12.5px;color:var(--ink-3)}
.exp .v{font-size:15px}
.daylabel{font-size:12.5px;color:var(--ink-3);margin:16px 2px 2px}

.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding:0 2px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%}
.bars .bi{border-radius:3px 3px 0 0;background:var(--good);min-height:2px}
.bars .bl{font-size:10px;color:var(--ink-3);text-align:center}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile .k{font-size:12.5px;color:var(--ink-2)}
.tile .v{font-size:21px;margin-top:2px}

.item{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:none}
.item .mid{flex:1;min-width:0}
.item .s{font-size:12.5px;color:var(--ink-3)}
.item.child{padding-left:22px}
.item.child .mid::before{content:"└ ";color:var(--ink-3)}

.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:500}
.btn.primary{background:var(--good);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn+.btn{margin-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--good);color:var(--on-accent);border-color:transparent;font-weight:600}
.chip.sm{padding:6px 10px;font-size:12.5px}

/* Theme picker */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sw{border:1px solid var(--line);border-radius:13px;padding:11px 3px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;line-height:1.2}
.sw .dot{width:22px;height:22px;border-radius:50%}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Tab bar and add-expense button */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--tabbg);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3)}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--good)}
.fab{position:fixed;z-index:31;right:max(18px,calc(50% - 270px + 18px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:19px;background:var(--good);color:var(--on-accent);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 22px var(--shadow)}
.fab:active{transform:scale(.94)}

/* Bottom sheets and notifications */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:540px;max-height:92vh;max-height:calc(100dvh - env(safe-area-inset-top) - 16px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:8px var(--gut) calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pace .fill{transition:none}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:19px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.bigamount{font-size:38px!important;text-align:center;padding:14px!important;font-family:"Instrument Serif",Georgia,serif}
.rowbtns{display:flex;gap:9px;margin-top:6px}
.rowbtns .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:500;box-shadow:0 6px 18px var(--shadow);max-width:calc(100% - 32px);text-align:center}
.warnbar{background:var(--warn);color:var(--on-warn);padding:calc(9px + env(safe-area-inset-top)) 14px 9px;font-size:13px;text-align:center}
.empty{text-align:center;color:var(--ink-2);padding:26px 10px;font-size:14px}
</style>
<script>
/* Themes: eight hues, each available in dark or light mode. The whole palette
   is derived from the hue, so every combination stays readable. The saved theme
   is applied before the page appears, so the app never flashes the default green. */
const THEMES=[
  {id:'vert',    name:'Vert',     h:167},
  {id:'ocean',   name:'Océan',    h:191},
  {id:'bleu',    name:'Bleu',     h:216},
  {id:'violet',  name:'Violet',   h:266},
  {id:'rose',    name:'Rose',     h:329},
  {id:'rouge',   name:'Rouge',    h:6,   bad:'#FF8FA8'},
  {id:'ambre',   name:'Ambre',    h:36,  warn:'#D8CF5F'},
  {id:'graphite',name:'Graphite', h:222, sat:.10}
];
function hsl2hex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const b=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');
  return '#'+b(0)+b(8)+b(4);
}
function palette(id,mode){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  const k=t.sat==null?1:t.sat;
  const C=(s,l)=>hsl2hex(t.h,Math.round(s*k),l);
  if(mode==='clair'){
    const bg=C(30,97);
    return {bg,surface:'#FFFFFF','surface-2':C(26,95),line:C(20,86),
      ink:C(34,13),'ink-2':C(14,30),'ink-3':C(12,41),
      good:C(58,31),warn:t.warn?'#7A5E00':'#8A5A00',bad:'#B33A2B',
      'on-accent':'#FFFFFF','on-warn':'#FFFFFF',
      tabbg:'#FFFFFFEB',scrim:'rgba(24,32,30,.38)',shadow:'rgba(20,30,28,.16)',scheme:'light'};
  }
  const bg=C(40,10);
  return {bg,surface:C(36,14),'surface-2':C(35,17),line:C(30,25),
    ink:C(22,93),'ink-2':C(16,68),'ink-3':C(14,59),
    good:C(48,70),warn:t.warn||'#E9B45A',bad:t.bad||'#EE8872',
    'on-accent':C(45,10),'on-warn':'#231602',
    tabbg:bg+'EB',scrim:'rgba(6,14,12,.62)',shadow:'rgba(0,0,0,.45)',scheme:'dark'};
}
function applyTheme(id,mode){
  const p=palette(id,mode),r=document.documentElement;
  for(const k in p) if(k!=='scheme') r.style.setProperty('--'+k,p[k]);
  r.style.colorScheme=p.scheme;
  const mt=document.querySelector('meta[name=theme-color]');
  if(mt)mt.setAttribute('content',p.bg);
  const sb=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');
  if(sb)sb.setAttribute('content',p.scheme==='light'?'default':'black-translucent');
}
try{
  const s=JSON.parse(localStorage.getItem('budget.v1')||'{}').settings||{};
  applyTheme(s.theme||'vert',s.mode||'sombre');
}catch(e){}
</script>
</head>
<body>
<div id="storewarn" class="warnbar hidden">Le navigateur bloque l'enregistrement local. Les données seront perdues à la fermeture — ouvre le fichier depuis un serveur ou exporte régulièrement.</div>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Ajouter une dépense">+</button>
<nav class="tabs" id="tabs"></nav>
<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const uid=()=>Math.random().toString(36).slice(2,9);
const num=(x)=>{const v=parseFloat(String(x??'').replace(',','.').replace(/[^\d.-]/g,''));return isFinite(v)?v:0};
const eur=(n,dec)=>{const d=dec??(Math.abs(n%1)>0.004?2:0);return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n)};
const pct=(x)=>Math.round(x*100)+' %';
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KEY='budget.v1';
let persistent=true;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){persistent=false;$('#storewarn').classList.remove('hidden')}}
/* Every change is stored on the device right away, then copied to the backup
   folder when one is connected. */
function save(opt){
  D.updatedAt=new Date().toISOString();
  saveLocal();
  if(!opt||opt.backup!==false)queueBackup();
}
function loadRaw(){try{return localStorage.getItem(KEY)}catch(e){persistent=false;$('#storewarn').classList.remove('hidden');return null}}

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const today=()=>new Date();
const thisKey=()=>keyOf(today());
function shiftKey(k,n){const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return keyOf(d)}
function daysIn(k){const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
function labelOf(k){const[y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function shortLabel(k){const[y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('fr-FR',{month:'short'}).format(new Date(y,m-1,1)).replace('.','')}
function dayLabel(iso){const d=new Date(iso+'T12:00');const t=new Date();const y=new Date(Date.now()-864e5);
  if(d.toDateString()===t.toDateString())return "Aujourd'hui";
  if(d.toDateString()===y.toDateString())return "Hier";
  return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)}

/* A new budget starts with everyday categories; Savings is counted apart from
   spending. */
function defaults(){
  const C=(id,name,emoji,budget,extra={})=>({id,name,emoji,budget,parent:null,...extra});
  return {v:2,
    settings:{alert:.8,carry:true,theme:'vert',mode:'sombre',
      salary:{label:'Salaire net',net:0,months:12,mode:'reel',bonusLabel:'13ᵉ mois',parts:[]},
      backup:{auto:true,daily:false,name:'budget.json',lastAt:null,remindDays:7}},
    categories:[
      C('alim','Alimentaire','🛒',null),
      C('resto','Restaurants & bars','🍜',null),
      C('abo','Abonnements','🔁',null),
      C('logement','Logement','🏠',null),
      C('transport','Transport','🚆',null),
      C('sante','Santé','➕',null),
      C('loisirs','Loisirs','🎮',null),
      C('shopping','Achats','👕',null),
      C('divers','Divers','✳️',null),
      C('epargne','Épargne','🏦',null,{save:true})
    ],
    recurring:[],
    months:{}
  };
}
let D=(()=>{const r=loadRaw();if(!r)return defaults();try{const p=JSON.parse(r);return p&&p.categories?p:defaults()}catch(e){return defaults()}})();
let cur=thisKey(), view='mois';

/* Data from an older version or a damaged backup file still opens: missing
   parts are restored instead of breaking the app. */
function repair(){
  if(!D||typeof D!=='object')D=defaults();
  if(!D.settings||typeof D.settings!=='object')D.settings={};
  if(!Array.isArray(D.categories)||!D.categories.length)D.categories=defaults().categories;
  if(!Array.isArray(D.recurring))D.recurring=[];
  if(!D.months||typeof D.months!=='object')D.months={};
  Object.keys(D.months).forEach(k=>{
    const m=D.months[k];
    if(!m||typeof m!=='object'){delete D.months[k];return}
    if(!Array.isArray(m.incomes))m.incomes=[];
    if(!Array.isArray(m.expenses))m.expenses=[];
    if(!m.budgets||typeof m.budgets!=='object')m.budgets={};
    m.closed=!!m.closed;
  });
}
/* Upgrade from the first version: the salary typed in month by month becomes
   the yearly salary profile, without being counted twice. */
function migrate(){
  repair();
  const s=D.settings;
  if(!(D.v>=2)){
    const keys=Object.keys(D.months||{}).sort();
    const isSal=i=>/salaire|paie|paye/i.test(i.label||'');
    let net=0;
    for(const k of keys.slice().reverse()){
      const inc=D.months[k].incomes||[];
      const sal=inc.find(isSal)||(inc.length===1?inc[0]:null);
      if(sal&&sal.amount>0){net=sal.amount;break}
    }
    keys.forEach(k=>{
      const inc=D.months[k].incomes||[];
      const sal=inc.find(isSal)||(inc.length===1?inc[0]:null);
      if(sal)sal.sid='base';
      inc.forEach(i=>{if(!i.sid&&i.keep===undefined)i.keep=true});
    });
    s.salary={label:'Salaire net',net,months:12,mode:'reel',bonusLabel:'13ᵉ mois',parts:[]};
    D.v=2;
  }
  s.theme=s.theme||'vert';
  s.mode=s.mode||'sombre';
  if(!s.salary)s.salary={label:'Salaire net',net:0,months:12,mode:'reel',bonusLabel:'13ᵉ mois',parts:[]};
  if(!s.backup)s.backup={auto:true,daily:false,name:'budget.json',lastAt:null,remindDays:7};
  if(s.alert==null)s.alert=.8;
  if(s.carry==null)s.carry=true;
}
migrate();

const catOf=id=>D.categories.find(c=>c.id===id);
const kids=id=>D.categories.filter(c=>c.parent===id);
const roots=()=>D.categories.filter(c=>!c.parent);
function rootOf(id){let c=catOf(id);let g=0;while(c&&c.parent&&g++<6)c=catOf(c.parent);return c}
const isSave=id=>{const r=rootOf(id);return !!(r&&r.save)};
const catPath=id=>{const c=catOf(id);if(!c)return'Supprimée';const p=c.parent?catOf(c.parent):null;return p?p.name+' · '+c.name:c.name};
const emojiOf=id=>{const c=catOf(id);return (c&&c.emoji)||(rootOf(id)||{}).emoji||'•'};

function monthlyAmount(r){return r.freq==='yearly'?r.amount/12:r.freq==='quarterly'?r.amount/3:r.amount}
function freqLabel(r){return r.freq==='yearly'?'annuel, lissé':r.freq==='quarterly'?'trimestriel, lissé':'mensuel'}

/* Salary profile: a monthly net pay plus optional extra months (13th, 14th)
   paid on any months of the year, counted either on the months they are paid
   or spread evenly over twelve months. Each month's salary lines come from the
   profile; incomes entered by hand (bonus, refund) are never changed by it. */
const MONTHNAMES=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MONTHSHORT=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
const frList=a=>a.length>1?a.slice(0,-1).join(', ')+' et '+a[a.length-1]:(a[0]||'');
const r2=x=>+(+x||0).toFixed(2);
const SAL=()=>D.settings.salary;
function bonusTotal(s){return (s.parts||[]).reduce((a,p)=>a+(+p.amount||0),0)}
function salaryYear(s){return r2(s.net*12+bonusTotal(s))}
function salaryLines(k){
  const s=SAL(),mo=+k.slice(5,7),out=[];
  if(s.mode==='lisse'){
    out.push({sid:'base',label:s.label||'Salaire net',amount:r2(s.net+bonusTotal(s)/12),smoothed:bonusTotal(s)>0});
  }else{
    out.push({sid:'base',label:s.label||'Salaire net',amount:r2(s.net)});
    (s.parts||[]).filter(p=>+p.month===mo&&+p.amount).forEach(p=>{
      out.push({sid:'p'+p.month,label:s.bonusLabel||'13ᵉ mois',amount:r2(p.amount)});
    });
  }
  return out;
}
function syncSalary(m,k){
  const want=salaryLines(k),manual=m.incomes.filter(i=>!i.sid);
  m.incomes=want.map(w=>{
    const old=m.incomes.find(i=>i.sid===w.sid);
    return {id:old?old.id:uid(),...w};
  }).concat(manual);
}
/* A profile change applies to the displayed month and the following ones; past
   and closed months keep what was actually received. */
function syncSalaryForward(){
  Object.keys(D.months).forEach(k=>{if(k>=cur&&!D.months[k].closed)syncSalary(D.months[k],k)});
}
function salarySummary(){
  const s=SAL(),bt=bonusTotal(s);
  if(!s.net&&!bt)return 'à configurer';
  if(!bt)return '12 mois';
  const nb=s.net?Math.round((12+bt/s.net)*10)/10:0;
  const lab=nb?String(nb).replace('.',',')+' mois':eur(bt)+' en plus';
  if(s.mode==='lisse')return lab+', lissé sur l\'année';
  const n=(s.parts||[]).filter(p=>+p.amount).map(p=>MONTHNAMES[+p.month-1]);
  return lab+' · '+(frList(n)||'—');
}

/* A new month starts with the salary, the incomes marked as monthly, the
   envelopes and the recurring expenses. */
function ensureMonth(k){
  if(D.months[k])return D.months[k];
  const prev=D.months[shiftKey(k,-1)];
  const m={incomes:prev?prev.incomes.filter(i=>!i.sid&&i.keep!==false).map(i=>({...i,id:uid()})):[],
           budgets:{},expenses:[],closed:false};
  syncSalary(m,k);
  D.categories.forEach(c=>{if(c.budget!=null)m.budgets[c.id]=c.budget});
  D.recurring.filter(r=>r.active!==false).forEach(r=>{
    m.expenses.push({id:uid(),label:r.label,amount:+monthlyAmount(r).toFixed(2),catId:r.catId,date:k+'-01',rid:r.id});
  });
  D.months[k]=m;save();return m;
}

function envOf(m,id){
  if(m.budgets[id]!=null)return m.budgets[id];
  const ks=kids(id);
  if(!ks.length)return 0;
  return ks.reduce((s,c)=>s+(m.budgets[c.id]??0),0);
}
function spentOf(m,id){
  const ids=new Set([id,...kids(id).map(c=>c.id)]);
  return m.expenses.reduce((s,e)=>ids.has(e.catId)?s+e.amount:s,0);
}
function rawTotals(m){
  let income=m.incomes.reduce((s,i)=>s+i.amount,0),expense=0,saving=0;
  m.expenses.forEach(e=>{isSave(e.catId)?saving+=e.amount:expense+=e.amount});
  return {income,expense,saving};
}
/* Balance carry-over (optional): what is left at the end of a month is added to
   the next one, and overspending is deducted from it. */
function carryFor(k){
  if(!D.settings.carry)return 0;
  const keys=Object.keys(D.months).sort();let acc=0;
  for(const kk of keys){
    if(kk>=k)break;
    const t=rawTotals(D.months[kk]);
    acc+=t.income-t.expense-t.saving;
  }
  return acc;
}
function totals(k){
  const m=D.months[k];const t=rawTotals(m);const carry=carryFor(k);
  return {...t,carry,left:t.income+carry-t.expense-t.saving};
}
function envTotal(m){return roots().filter(c=>!c.save).reduce((s,c)=>s+envOf(m,c.id),0)}

function render(){
  const m=ensureMonth(cur);
  $('#app').innerHTML=topbar()+(view==='mois'?viewMois(m):view==='depenses'?viewDepenses(m):view==='recap'?viewRecap(m):viewReglages(m));
  renderTabs();
  $('#fab').classList.toggle('hidden',m.closed);
  bind();
}
function topbar(){
  const next=shiftKey(cur,1)<=shiftKey(thisKey(),12);
  return `<div class="topbar">
    <button class="navbtn" data-nav="-1" aria-label="Mois précédent">‹</button>
    <h1>${labelOf(cur)}</h1>
    <button class="navbtn" data-nav="1" ${next?'':'disabled'} aria-label="Mois suivant">›</button>
  </div>`;
}
function renderTabs(){
  const T=[['mois','Mois','<path d="M4 6h16M4 12h16M4 18h10"/>'],
           ['depenses','Dépenses','<path d="M3 7h18v12H3z"/><path d="M3 11h18"/>'],
           ['recap','Récap','<path d="M5 20V9M12 20V4M19 20v-7"/>'],
           ['reglages','Réglages','<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>']];
  $('#tabs').innerHTML=T.map(([id,lb,ic])=>`<button data-tab="${id}" aria-selected="${view===id}"><svg viewBox="0 0 24 24">${ic}</svg>${lb}</button>`).join('');
}

/* Month screen: money left to live on, spending pace against the calendar,
   envelope alerts and latest expenses. */
function viewMois(m){
  const t=totals(cur);
  const bt=envTotal(m);
  const ratio=bt?t.expense/bt:(t.income?t.expense/t.income:0);
  const isCur=cur===thisKey(),isPast=cur<thisKey();
  const dayR=isCur?today().getDate()/daysIn(cur):(isPast?1:0);
  const color=ratio>1?'var(--bad)':(isCur&&ratio>dayR+.06?'var(--warn)':'var(--good)');
  let cap;
  if(!bt) cap=`Aucune enveloppe définie pour l'instant. Fixe un budget par catégorie dans Réglages pour suivre ton rythme.`;
  else if(isCur) cap=(ratio>dayR+.06?`Tu dépenses plus vite que le mois ne passe — `:`Rythme tenu — `)+`${pct(ratio)} des enveloppes utilisées, ${pct(dayR)} du mois écoulé.`;
  else cap=`${pct(ratio)} des enveloppes utilisées sur le mois.`;

  const alerts=roots().filter(c=>!c.save).map(c=>{
    const b=envOf(m,c.id);if(!b)return null;
    const s=spentOf(m,c.id),r=s/b;
    if(r>1)return {over:true,html:`<b>${esc(c.name)}</b> dépasse de ${eur(s-b)} — ${eur(s)} pour ${eur(b)} prévus.`};
    if(r>=D.settings.alert)return {over:false,html:`<b>${esc(c.name)}</b> à ${pct(r)} de son enveloppe, il reste ${eur(b-s)}.`};
    return null;
  }).filter(Boolean);

  const envRows=roots().filter(c=>envOf(m,c.id)>0||spentOf(m,c.id)>0).map(c=>{
    const b=envOf(m,c.id),s=spentOf(m,c.id),r=b?s/b:0;
    const col=r>1?'var(--bad)':r>=D.settings.alert?'var(--warn)':'var(--good)';
    const sub=b?(s<=b?`Il reste ${eur(b-s)}`:`Dépassement de ${eur(s-b)}`):'Sans enveloppe';
    const kidLines=kids(c.id).filter(k=>spentOf(m,k.id)>0).map(k=>`<div class="sub"><span style="padding-left:2px">└ ${esc(k.name)}</span><span class="num">${eur(spentOf(m,k.id))}</span></div>`).join('');
    return `<button class="env" data-cat="${c.id}">
      <div class="row1"><span>${c.emoji}</span><span class="nm">${esc(c.name)}</span>
        <span class="amt num">${eur(s)}${b?` <span class="muted">/ ${eur(b)}</span>`:''}</span></div>
      ${b?`<div class="rail"><div class="fill" style="width:${Math.min(100,r*100)}%;background:${col}"></div></div>`:''}
      <div class="sub"><span>${sub}</span><span>${t.income?pct(s/t.income)+' du net':''}</span></div>
      ${kidLines}</button>`;
  }).join('');

  const last=[...m.expenses].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,5).map(expRow).join('');

  const bkWarn=backupLate()?`<div class="alert" style="border-left-color:var(--ink-2)"><span class="ico">💾</span><div>${
      D.settings.backup.lastAt?`Aucune sauvegarde depuis ${backupAge()} jours.`:`Tes données ne sont enregistrées que sur cet appareil.`}
      <button ${dirH&&!needAuth?'data-act="bsave"':'data-tab="reglages"'} style="color:var(--good)">${dirH&&!needAuth?'Sauvegarder':'Configurer'}</button></div></div>`:'';

  return `${m.closed?`<div class="alert" style="border-left-color:var(--ink-2)"><span class="ico">🔒</span><div>Mois clôturé. <button data-unlock style="color:var(--good)">Rouvrir</button></div></div>`:''}
  ${bkWarn}
  <div class="hero">
    <span class="label">Reste à vivre</span>
    <span class="amount serif num" style="color:${t.left<0?'var(--bad)':'var(--ink)'}">${eur(t.left)}</span>
    <span class="sub">sur ${eur(t.income)} de revenus${t.carry?` · report de ${eur(t.carry)}`:''}</span>
    <div class="pace">
      <div class="rail"><div class="fill" style="width:${Math.min(100,ratio*100)}%;background:${color}"></div>
      ${isCur?`<div class="today" style="left:${dayR*100}%"></div>`:''}</div>
      <div class="cap">${cap}</div>
    </div>
    <div class="split">
      <div><div class="k">Dépensé</div><div class="v num">${eur(t.expense)}</div></div>
      <div><div class="k">Épargné</div><div class="v num">${eur(t.saving)}</div></div>
      <div><div class="k">Par jour restant</div><div class="v num">${isCur&&t.left>0?eur(t.left/Math.max(1,daysIn(cur)-today().getDate()+1)):'—'}</div></div>
    </div>
  </div>
  ${alerts.map(a=>`<div class="alert ${a.over?'over':''}"><span class="ico">${a.over?'⚠️':'⏳'}</span><div>${a.html}</div></div>`).join('')}
  <section>
    <div class="sechead"><h2>Enveloppes</h2><button data-tab="reglages">Modifier</button></div>
    ${envRows?`<div class="card">${envRows}</div>`:`<div class="empty">Rien de dépensé ce mois-ci. Touche le + pour commencer.</div>`}
  </section>
  <section>
    <div class="sechead"><h2>Dernières dépenses</h2>${m.expenses.length>5?`<button data-tab="depenses">Tout voir</button>`:''}</div>
    ${last?`<div class="card">${last}</div>`:`<div class="empty">Aucune dépense enregistrée.</div>`}
  </section>`;
}
function expRow(e){
  return `<button class="exp" data-exp="${e.id}">
    <span class="em">${emojiOf(e.catId)}</span>
    <span class="mid"><span class="t">${esc(e.label||catPath(e.catId))}</span>
    <span class="s">${esc(catPath(e.catId))}${e.rid?' · auto':''}</span></span>
    <span class="v num">${eur(e.amount)}</span></button>`;
}

/* Expenses screen: every expense of the month, grouped by day, filterable by
   category. */
let filterCat='';
function viewDepenses(m){
  let list=[...m.expenses];
  if(filterCat)list=list.filter(e=>e.catId===filterCat||catOf(e.catId)?.parent===filterCat);
  list.sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  const tot=list.reduce((s,e)=>s+e.amount,0);
  let html='',day='';
  list.forEach(e=>{if(e.date!==day){day=e.date;html+=`</div><div class="daylabel">${dayLabel(e.date)}</div><div class="card">`}html+=expRow(e)});
  html=html?html.replace(/^<\/div>/,'')+'</div>':'';
  const opts=['<option value="">Toutes les catégories</option>',...roots().map(c=>`<option value="${c.id}" ${filterCat===c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`)].join('');
  return `<div class="field"><select id="filter">${opts}</select></div>
    <div class="tile" style="margin-bottom:6px"><div class="k">${list.length} dépense${list.length>1?'s':''}</div><div class="v serif num">${eur(tot)}</div></div>
    ${html||`<div class="empty">Aucune dépense ici.</div>`}`;
}

/* Summary screen: where the money goes, comparison with the last three months
   and the balance history. */
function viewRecap(m){
  const t=totals(cur);
  const parts=roots().map(c=>({c,s:spentOf(m,c.id),b:envOf(m,c.id)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const max=Math.max(1,...parts.map(p=>p.s));
  const rows=parts.map(({c,s,b})=>{
    const d=b?s-b:null;
    return `<div style="padding:11px 2px;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:9px;align-items:baseline"><span>${c.emoji}</span><span style="flex:1">${esc(c.name)}</span>
      <span class="num">${eur(s)}</span></div>
      <div class="rail" style="height:5px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden">
        <div style="height:100%;width:${s/max*100}%;background:${c.save?'var(--ink-2)':d>0?'var(--bad)':'var(--good)'};border-radius:3px"></div></div>
      <div class="tiny muted" style="display:flex;justify-content:space-between;margin-top:5px">
        <span>${t.income?pct(s/t.income)+' du net':''}</span>
        <span>${d===null?'pas d\'enveloppe':d>0?'+'+eur(d)+' vs prévu':eur(-d)+' sous l\'enveloppe'}</span></div></div>`;
  }).join('');

  const prevs=[1,2,3].map(i=>D.months[shiftKey(cur,-i)]).filter(Boolean);
  let compare='';
  if(prevs.length){
    const diffs=roots().map(c=>{
      const avg=prevs.reduce((s,mm)=>s+spentOf(mm,c.id),0)/prevs.length;
      return {c,avg,now:spentOf(m,c.id),d:spentOf(m,c.id)-avg};
    }).filter(x=>Math.abs(x.d)>=5).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,5);
    compare=diffs.length?`<section><div class="sechead"><h2>Par rapport à d'habitude</h2></div><div class="card">${
      diffs.map(x=>`<div class="item"><span>${x.c.emoji}</span><span class="mid">${esc(x.c.name)}<span class="s">moyenne ${eur(x.avg)} sur ${prevs.length} mois</span></span>
      <span class="num ${x.d>0?'bad':'good'}">${x.d>0?'+':'−'}${eur(Math.abs(x.d))}</span></div>`).join('')}</div></section>`:'';
  }

  const keys=Object.keys(D.months).sort().slice(-12);
  const soldes=keys.map(k=>{const tt=rawTotals(D.months[k]);return {k,v:tt.income-tt.expense-tt.saving}});
  const amp=Math.max(1,...soldes.map(s=>Math.abs(s.v)));
  const hist=keys.length>1?`<section><div class="sechead"><h2>Historique</h2></div>
    <div class="card" style="padding:16px 12px">
      <div class="bars">${soldes.map(s=>`<button class="b" data-goto="${s.k}" title="${eur(s.v)}">
        <div class="bi" style="height:${Math.abs(s.v)/amp*82}%;background:${s.v<0?'var(--bad)':'var(--good)'};${s.k===cur?'outline:1px solid var(--ink)':''}"></div>
        <div class="bl">${shortLabel(s.k)}</div></button>`).join('')}</div>
      <div class="tiny muted" style="margin-top:10px">Solde de chaque mois (revenus − dépenses − épargne). Touche une barre pour l'ouvrir.</div>
    </div></section>`:'';

  return `<div class="grid2" style="margin-bottom:10px">
      <div class="tile"><div class="k">Revenus</div><div class="v serif num">${eur(t.income)}</div></div>
      <div class="tile"><div class="k">Dépenses</div><div class="v serif num">${eur(t.expense)}</div></div>
      <div class="tile"><div class="k">Épargne</div><div class="v serif num">${eur(t.saving)}</div></div>
      <div class="tile"><div class="k">Solde</div><div class="v serif num" style="color:${t.left<0?'var(--bad)':'var(--good)'}">${eur(t.left)}</div></div>
    </div>
    <section><div class="sechead"><h2>Où part l'argent</h2></div>
      ${rows?`<div class="card">${rows}</div>`:`<div class="empty">Rien à résumer pour ce mois.</div>`}</section>
    ${compare}${hist}`;
}

/* Settings screen. Backup options depend on the browser: where a folder can be
   written (Chrome), a single budget.json is kept up to date there; elsewhere
   (Firefox, Safari on iOS) the backup is shared or downloaded daily instead. */
function viewReglages(m){
  const S=D.settings;
  const salL=m.incomes.filter(i=>i.sid),manL=m.incomes.filter(i=>!i.sid);
  const incTot=m.incomes.reduce((a,i)=>a+i.amount,0);
  const inc=(salL.length?salL:[{sid:'base',label:'Salaire',amount:0}]).map(i=>
      `<button class="item" data-salary="1"><span>💼</span><span class="mid">${esc(i.label)}
        <span class="s">${i.sid==='base'?esc(salarySummary())+(i.smoothed?' · complément lissé inclus':''):'mois supplémentaire'}</span></span>
        <span class="num">${eur(i.amount)}</span></button>`).join('')
    +manL.map(i=>`<button class="item" data-income="${i.id}"><span>＋</span><span class="mid">${esc(i.label)}
        <span class="s">${i.keep===false?'ce mois uniquement':'chaque mois'}</span></span>
        <span class="num">${eur(i.amount)}</span></button>`).join('')
    +`<div class="item" style="border-top:1px solid var(--line)"><span class="mid muted">Total du mois</span><span class="num">${eur(incTot)}</span></div>`;

  const sw=THEMES.map(t=>{
    const p=palette(t.id,S.mode),on=S.theme===t.id;
    return `<button class="sw" data-theme="${t.id}" aria-pressed="${on}"
      style="background:${p.bg};color:${p['ink-2']};border-color:${on?p.good:p.line}${on?';box-shadow:inset 0 0 0 1px '+p.good:''}">
      <span class="dot" style="background:${p.good}"></span>${t.name}</button>`}).join('');

  const bk=S.backup,last=bk.lastAt?'Dernière sauvegarde '+whenTxt(bk.lastAt):'Jamais sauvegardé';
  const dailyBox=`<label class="card" style="display:flex;gap:10px;align-items:flex-start;padding:14px;margin-top:9px">
      <input type="checkbox" id="bdaily" ${bk.daily?'checked':''} style="width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--good)">
      <span>Télécharger une sauvegarde chaque jour<span class="s tiny muted" style="display:block">Une fois par jour, au premier appui dans l'app : le fichier part dans le dossier Téléchargements du téléphone. Le navigateur peut demander confirmation.</span></span></label>`;
  let backupUI;
  if(FS_OK&&dirH){
    backupUI=`<div class="card" style="padding:14px;margin-bottom:9px">
        <div style="display:flex;gap:10px;align-items:flex-start"><span>📁</span><div style="flex:1;min-width:0">
          <div style="word-break:break-all">${esc(dirH.name)}/${esc(backupName())}</div>
          <div class="tiny muted">${last}${needAuth?' · accès à réautoriser':''}</div></div></div>
        <label style="display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);margin-top:12px;padding:12px 0 2px">
          <input type="checkbox" id="bauto" ${bk.auto!==false?'checked':''} style="width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--good)">
          <span>Sauvegarder automatiquement<span class="s tiny muted" style="display:block">Ce fichier unique est réécrit à chaque modification, sans rien demander et sans créer de copie datée.</span></span></label>
      </div>
      ${needAuth?`<button class="btn primary" data-act="reauth">Réautoriser l'accès au dossier</button>`:''}
      <button class="btn" data-act="bsave">Sauvegarder maintenant</button>
      <button class="btn" data-act="bload">Récupérer depuis le dossier</button>
      <div class="rowbtns"><button class="btn ghost" data-act="bfolder">Changer de dossier</button>
        <button class="btn ghost" data-act="bforget">Oublier</button></div>`;
  }else if(FS_OK){
    backupUI=`<button class="btn primary" data-act="bfolder">Choisir un dossier de sauvegarde</button>
      <div class="tiny muted" style="margin:9px 2px 0">${last}. Choisis le dossier que tu veux, par exemple <i>Documents/Budget</i> : l'app y écrit <b>${esc(backupName())}</b> — un seul fichier, réécrit à chaque modification — et le relit à l'ouverture. Installe l'app sur l'écran d'accueil pour que l'autorisation soit conservée durablement.</div>`;
  }else{
    backupUI=`<button class="btn primary" data-act="bshare">${SHARE_OK?'Envoyer la sauvegarde…':'Télécharger la sauvegarde'}</button>
      <div class="tiny muted" style="margin:9px 2px 0">${last}. Ce navigateur ne donne pas accès à un dossier — c'est le cas de Firefox et de Safari, et ça ne dépend pas de l'app. ${SHARE_OK?'Le partage permet d\'envoyer le fichier vers Fichiers, Drive ou iCloud, en écrasant la sauvegarde précédente. ':''}Sinon, le téléchargement quotidien ci-dessous est l'automatisation la plus proche.</div>
      ${dailyBox}`;
  }

  const cats=roots().map(c=>{
    const b=m.budgets[c.id];
    const kk=kids(c.id).map(k=>`<button class="item child" data-catedit="${k.id}"><span class="mid">${esc(k.name)}</span><span class="num muted">${m.budgets[k.id]!=null?eur(m.budgets[k.id]):'—'}</span></button>`).join('');
    return `<button class="item" data-catedit="${c.id}"><span>${c.emoji}</span><span class="mid">${esc(c.name)}${c.save?'<span class="s">compté comme épargne</span>':''}</span><span class="num ${b!=null?'':'muted'}">${b!=null?eur(b):'pas d\'enveloppe'}</span></button>${kk}`;
  }).join('');
  const recs=D.recurring.length?D.recurring.map(r=>`<button class="item" data-rec="${r.id}" style="${r.active===false?'opacity:.45':''}">

function sheet(title,body,onMount){
  const w=el(`<div class="sheetwrap"><div class="sheet"><div class="grab"></div><h2>${title}</h2>${body}</div></div>`);
  w.addEventListener('click',e=>{if(e.target===w)w.remove()});
  document.body.appendChild(w);
  onMount&&onMount(w);
  const f=w.querySelector('input,select');if(f)setTimeout(()=>f.focus(),60);
  return w;
}
function toast(msg){const t=el(`<div class="toast">${msg}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function catOptions(sel){return D.categories.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.parent?'   ':''}${c.emoji||''} ${esc(catPath(c.id))}</option>`).join('')}

function salarySheet(){
  const s=SAL();
  const st={net:+s.net||0,months:+s.months||12,mode:s.mode||'reel',label:s.bonusLabel||'13ᵉ mois',
    parts:(s.parts||[]).map(p=>({month:+p.month,amount:+p.amount||0})),custom:false};
  if(st.months>12&&!st.parts.length)st.parts=[{month:6,amount:0},{month:11,amount:0}];
  if(st.months<=12&&st.parts.length)st.months=13;

  const dec=v=>v?String(v).replace('.',','):'';
  sheet('Salaire',`
    <div class="field"><label for="net">Net mensuel</label>
      <input class="bigamount num" id="net" inputmode="decimal" placeholder="0,00" value="${dec(st.net)}"></div>
    <div class="field"><label>Combien de mois par an ?</label><div class="chips" id="nb"></div></div>
    <div id="dyn"></div>
    <div class="tile" id="tot" style="margin:16px 0 14px"></div>
    <button class="btn primary" id="ok">Enregistrer</button>
    <div class="tiny muted" style="margin-top:12px">S'applique à ${labelOf(cur)} et aux mois suivants ; les mois passés gardent le salaire réellement perçu. Pour une variation exceptionnelle (heures supplémentaires, prime), ajoute plutôt un revenu à part.</div>`,
  w=>{
    const q=s=>w.querySelector(s);
    const readNet=()=>{st.net=num(q('#net').value)};
    const readParts=()=>{
      w.querySelectorAll('.pamt').forEach(i=>{
        const p=st.parts.find(x=>x.month===+i.dataset.m);if(p)p.amount=num(i.value)});
      const l=q('#blab');if(l)st.label=l.value;
    };
    /* Extra months are split evenly across the payment months until an amount
       is typed by hand. */
    const spread=()=>{
      if(st.custom||st.months<=12)return;
      const extra=r2(st.net*(st.months-12)),n=st.parts.length||1;
      st.parts.forEach(p=>p.amount=r2(extra/n));
    };
    const total=()=>{
      const bt=st.parts.reduce((a,p)=>a+p.amount,0),yr=r2(st.net*12+(st.months>12?bt:0));
      q('#tot').innerHTML=`<div class="k">Total annuel net</div><div class="v serif num">${eur(yr)}</div>
        <div class="tiny muted" style="margin-top:3px">soit ${eur(yr/12)} par mois en moyenne${st.months>12&&bt?` · dont ${eur(bt)} de mois supplémentaires`:''}</div>`;
    };
    function draw(){
      q('#nb').innerHTML=[12,13,14].map(n=>`<button type="button" class="chip" data-nb="${n}" aria-pressed="${st.months===n}">${n} mois</button>`).join('');
      st.parts.sort((a,b)=>a.month-b.month);
      q('#dyn').innerHTML=st.months<=12?'':`
        <div class="field"><label>Versé en</label><div class="chips">${
          MONTHSHORT.map((nm,i)=>`<button type="button" class="chip sm" data-mo="${i+1}" aria-pressed="${st.parts.some(p=>p.month===i+1)}" aria-label="${MONTHNAMES[i]}">${nm}</button>`).join('')}</div>
          <div class="tiny muted" style="margin-top:7px">Touche un mois pour l'ajouter ou l'enlever : le complément peut tomber sur n'importe quels mois, en une ou plusieurs fois, et chaque montant reste modifiable.</div></div>
        <div class="field"><label for="blab">Nom du complément</label>
          <input id="blab" value="${esc(st.label)}" placeholder="13ᵉ mois, prime de vacances…"></div>
        ${st.parts.map(p=>`<div class="field"><label for="pa${p.month}">Versé en ${MONTHNAMES[p.month-1]}</label>
          <input id="pa${p.month}" class="num pamt" data-m="${p.month}" inputmode="decimal" value="${dec(p.amount)}"></div>`).join('')}
        <div class="field"><label>Dans le budget mensuel</label><div class="chips">
          <button type="button" class="chip" data-md="reel" aria-pressed="${st.mode==='reel'}">Aux mois réels</button>
          <button type="button" class="chip" data-md="lisse" aria-pressed="${st.mode==='lisse'}">Lissé sur 12 mois</button></div>
          <div class="tiny muted" style="margin-top:7px">${st.mode==='reel'
            ?'Le complément apparaît comme revenu en '+(frList(st.parts.map(p=>MONTHNAMES[p.month-1]))||'les mois choisis')+', où le reste à vivre sera donc plus élevé.'
            :'Un douzième est ajouté chaque mois : le budget reste stable toute l\'année, mais les versements réels n\'apparaissent plus tels quels.'}</div></div>`;
      wire();total();
    }
    function wire(){
      w.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{
        readNet();readParts();st.months=+b.dataset.nb;st.custom=false;
        if(st.months>12&&!st.parts.length)st.parts=[{month:6,amount:0},{month:11,amount:0}];
        spread();draw();});
      w.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{
        readNet();readParts();const mo=+b.dataset.mo;
        const i=st.parts.findIndex(p=>p.month===mo);
        if(i>=0){if(st.parts.length>1)st.parts.splice(i,1)}else st.parts.push({month:mo,amount:0});
        spread();draw();});
      w.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{readNet();readParts();st.mode=b.dataset.md;draw()});
      w.querySelectorAll('.pamt').forEach(i=>i.oninput=()=>{st.custom=true;readParts();total()});
    }
    q('#net').oninput=()=>{
      readNet();
      if(!st.custom){spread();w.querySelectorAll('.pamt').forEach(i=>{
        const p=st.parts.find(x=>x.month===+i.dataset.m);if(p)i.value=dec(p.amount)})}
      total();
    };
    q('#ok').onclick=()=>{
      readNet();readParts();
      Object.assign(SAL(),{net:r2(st.net),months:st.months,mode:st.mode,
        bonusLabel:st.label.trim()||'13ᵉ mois',
        parts:st.months>12?st.parts.filter(p=>p.amount>0).map(p=>({month:p.month,amount:r2(p.amount)})):[]});
      syncSalaryForward();save();w.remove();render();toast('Salaire enregistré');
    };
    draw();
  });
}

/* Folder backup (Chrome). The user picks a folder once; a single budget.json is
   rewritten there after every change, never as dated copies.
   - At startup the file is read back: a fresh install restores it silently, and
     a file newer than the device is restored only after the user agrees.
   - The file is never overwritten before it has been compared with the device.
   - If folder access is lost (app not installed), saving pauses until the user
     grants it again with one tap.
   - A folder synced by Drive or Syncthing shares the budget across devices. */
const FS_OK=typeof window.showDirectoryPicker==='function';
const SHARE_OK=!!(navigator.canShare&&navigator.share);
let dirH=null, bTimer=null, needAuth=false, booting=true, dailyArmed=false;

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('budget.fs',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('h')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{
  const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbPut(k,v){try{const db=await idb();return await new Promise(res=>{
  const q=db.transaction('h','readwrite').objectStore('h').put(v,k);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}catch(e){return false}}
async function idbDel(k){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').delete(k)}catch(e){}}

async function granted(h,mode,ask){
  if(!h||!h.queryPermission)return !!h;
  try{
    if(await h.queryPermission({mode})==='granted')return true;
    if(!ask)return false;
    return await h.requestPermission({mode})==='granted';
  }catch(e){return false}
}
const backupName=()=>D.settings.backup.name||'budget.json';
async function fileH(create,ask){
  if(!dirH)return null;
  if(!await granted(dirH,'readwrite',ask))return null;
  try{return await dirH.getFileHandle(backupName(),{create:!!create})}catch(e){return null}
}
async function writeBackup(ask){
  if(!dirH)return false;
  try{
    const fh=await fileH(true,ask);if(!fh)return false;
    const w=await fh.createWritable();
    await w.write(JSON.stringify(D,null,2));
    await w.close();
    D.settings.backup.lastAt=new Date().toISOString();
    needAuth=false;saveLocal();
    if(ask)toast('Sauvegardé dans '+dirH.name);
    refreshSettings();
    return true;
  }catch(e){if(ask)toast("Écriture impossible dans ce dossier");return false}
}
function queueBackup(){
  if(!dirH||booting||D.settings.backup.auto===false)return;
  clearTimeout(bTimer);bTimer=setTimeout(()=>writeBackup(false),1200);
}
const isBudget=p=>!!(p&&typeof p==='object'&&Array.isArray(p.categories)&&p.categories.length&&p.months&&typeof p.months==='object');
async function readBackup(ask){
  const fh=await fileH(false,ask);if(!fh)return null;
  try{const t=await (await fh.getFile()).text();const p=JSON.parse(t);return isBudget(p)?p:null}
  catch(e){return null}
}
function adopt(p,msg){
  D=p;migrate();cur=thisKey();ensureMonth(cur);
  applyTheme(D.settings.theme,D.settings.mode);
  save({backup:false});render();toast(msg);
}
const hasData=()=>Object.keys(D.months||{}).some(k=>{const m=D.months[k];
  return m.expenses.length||m.incomes.some(i=>i.amount)});

async function chooseFolder(){
  let h;
  try{h=await showDirectoryPicker({id:'budget',mode:'readwrite',startIn:'documents'})}
  catch(e){return}
  dirH=h;await idbPut('dir',h);needAuth=false;booting=false;
  D.settings.backup.auto=true;
  D.settings.backup.daily=false;
  dailyArmed=false;
  /* If the chosen folder already holds a budget, the user decides which copy
     is kept: the folder's or the device's. */
  const p=await readBackup(true);
  if(p&&p.updatedAt&&(!hasData()||confirm('Ce dossier contient déjà une sauvegarde ('+whenTxt(p.updatedAt)+').\n\nOK : la récupérer sur cet appareil, en remplaçant les données actuelles.\nAnnuler : garder cet appareil et remplacer la sauvegarde du dossier.'))){
    adopt(p,'Données récupérées');return;
  }
  await writeBackup(true);render();
}
async function bootBackup(){
  if(!FS_OK){booting=false;return}
  dirH=await idbGet('dir');
  if(!dirH){booting=false;return}
  if(!await granted(dirH,'readwrite',false)){needAuth=true;booting=false;refreshSettings();return}
  const p=await readBackup(false);
  booting=false;
  if(!p){queueBackup();return}
  if(!hasData()){adopt(p,'Données récupérées du dossier');return}
  const mine=D.updatedAt||'',theirs=p.updatedAt||'';
  if(theirs>mine){
    if(confirm('La sauvegarde du dossier est plus récente ('+whenTxt(theirs)+'). Récupérer ces données ? Ce qui est sur cet appareil sera remplacé.'))
      adopt(p,'Données récupérées du dossier');
  }else if(mine>theirs)queueBackup();
}
async function reconnectFolder(){
  if(!dirH)return;
  if(await granted(dirH,'readwrite',true)){needAuth=false;await bootBackup();refreshSettings();toast('Dossier reconnecté')}
  else toast('Accès refusé');
}
async function forgetFolder(){
  dirH=null;needAuth=false;await idbDel('dir');render();toast('Dossier oublié');
}
function whenTxt(iso){
  const h=(Date.now()-new Date(iso))/36e5;
  if(!isFinite(h))return 'date inconnue';
  if(h<1)return "à l'instant";
  if(h<24)return 'il y a '+Math.max(1,Math.round(h))+' h';
  const j=Math.floor(h/24);
  return j===1?'hier':'il y a '+j+' jours';
}
function backupAge(){const l=D.settings.backup.lastAt;return l?Math.floor((Date.now()-new Date(l))/864e5):null}
/* Backup reminder: a banner on the Month screen after a chosen number of days
   without a backup (or never). */
function backupLate(){
  if(!hasData())return false;
  const rd=D.settings.backup.remindDays??7;
  if(!rd)return false;
  const a=backupAge();
  return a===null||a>=rd;
}
function refreshSettings(){if(view==='reglages'&&!document.querySelector('.sheetwrap'))render()}

/* Daily download, for browsers that cannot write to a folder (Firefox, Safari
   on iOS). Once a day, on the first tap in the app, a dated backup is saved to
   the phone's Downloads folder; it waits for a tap because browsers block
   downloads the user did not trigger. A blocked download never stops that tap
   from working. It never runs where folder backup is available. */
function armDailyBackup(){
  const bk=D.settings.backup;
  if(FS_OK||dirH||!bk.daily||!hasData())return;
  const since=bk.lastAt?Date.now()-new Date(bk.lastAt):Infinity;
  if(since<20*36e5)return;
  dailyArmed=true;
}
function fireDailyBackup(){
  if(!dailyArmed)return;
  dailyArmed=false;
  try{exportJSON(true)}catch(e){}
}

/* Sharing sends the backup to Files, Drive or iCloud; browsers that cannot
   share files get a download instead. */
async function shareBackup(){
  const file=new File([JSON.stringify(D,null,2)],backupName(),{type:'application/json'});
  if(!(SHARE_OK&&navigator.canShare({files:[file]})))return exportJSON();
  try{
    await navigator.share({files:[file],title:'Sauvegarde Budget'});
    D.settings.backup.lastAt=new Date().toISOString();saveLocal();refreshSettings();
  }catch(e){}
}

function exportJSON(auto){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='budget-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  D.settings.backup.lastAt=new Date().toISOString();saveLocal();refreshSettings();
  toast(auto?'Sauvegarde du jour téléchargée':'Fichier exporté');
}
function importJSON(){
  const i=el('<input type="file" accept="application/json,.json" class="hidden">');
  document.body.appendChild(i);
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);if(!isBudget(p))throw 0;
      if(!confirm('Remplacer les données actuelles par ce fichier ?'))return;
      adopt(p,'Données importées');}catch(e){alert("Ce fichier n'est pas une sauvegarde valide.")}
      i.remove()};
    r.readAsText(f)};
  i.click();
}
function bind(){
  const f=$('#filter');if(f)f.onchange=()=>{filterCat=f.value;render()};
  const al=$('#alert');if(al)al.onchange=()=>{D.settings.alert=+al.value;save();render()};
  const cy=$('#carry');if(cy)cy.onchange=()=>{D.settings.carry=cy.checked;save();render()};
  const ba=$('#bauto');if(ba)ba.onchange=()=>{D.settings.backup.auto=ba.checked;save();if(ba.checked)writeBackup(true)};
  const br=$('#bremind');if(br)br.onchange=()=>{D.settings.backup.remindDays=+br.value;save();render()};
  const bd=$('#bdaily');if(bd)bd.onchange=()=>{
    D.settings.backup.daily=bd.checked;save();
    if(bd.checked)exportJSON(true);
    render();
  };
}
document.addEventListener('click',ev=>{
  fireDailyBackup();
  const g=s=>ev.target.closest(s);
  let t;
  if(t=g('[data-nav]')){cur=shiftKey(cur,+t.dataset.nav);ensureMonth(cur);render();return}
  if(t=g('[data-tab]')){view=t.dataset.tab;render();window.scrollTo(0,0);return}
  if(t=g('[data-goto]')){cur=t.dataset.goto;view='mois';render();return}
  if(t=g('[data-cat]')){filterCat=t.dataset.cat;view='depenses';render();return}
  if(t=g('[data-exp]')){
    if(D.months[cur].closed)return toast('Mois clôturé — rouvre-le pour modifier');
    expenseSheet(t.dataset.exp);return}
  if(t=g('[data-salary]')){
    if(D.months[cur].closed)return toast('Mois clôturé — rouvre-le pour modifier');
    salarySheet();return}
  if(t=g('[data-income]')){
    if(D.months[cur].closed)return toast('Mois clôturé — rouvre-le pour modifier');
    incomeSheet(t.dataset.income);return}
  if(t=g('[data-catedit]')){catSheet(t.dataset.catedit);return}
  if(t=g('[data-rec]')){recSheet(t.dataset.rec);return}
  if(t=g('[data-unlock]')){D.months[cur].closed=false;save();render();return}
  if(t=g('[data-theme]')){D.settings.theme=t.dataset.theme;applyTheme(D.settings.theme,D.settings.mode);save();render();return}
  if(t=g('[data-mode]')){D.settings.mode=t.dataset.mode;applyTheme(D.settings.theme,D.settings.mode);save();render();return}
  if(t=g('[data-act]')){
    const a=t.dataset.act;
    if(a==='income-add')incomeSheet();
    else if(a==='cat-add')catSheet();
    else if(a==='rec-add')recSheet();
    else if(a==='export')exportJSON();
    else if(a==='import')importJSON();
    else if(a==='bfolder')chooseFolder();
    else if(a==='bsave')writeBackup(true);
    else if(a==='reauth')reconnectFolder();
    else if(a==='bshare')shareBackup();
    else if(a==='bforget'){if(confirm('Oublier ce dossier ? Le fichier déjà écrit reste en place, mais la sauvegarde automatique s\'arrête.'))forgetFolder()}
    else if(a==='bload')(async()=>{
      const p=await readBackup(true);
      if(!p)return toast('Aucune sauvegarde lisible dans ce dossier');
      if(confirm('Remplacer les données de cet appareil par la sauvegarde du '+new Date(p.updatedAt||Date.now()).toLocaleString('fr-FR')+' ?'))adopt(p,'Données récupérées');
    })();
    else if(a==='close'){D.months[cur].closed=!D.months[cur].closed;save();render();toast(D.months[cur].closed?'Mois clôturé':'Mois rouvert')}
    else if(a==='reset'){if(confirm('Effacer toutes les données, y compris les mois passés ?')){
      const th=D.settings.theme,md=D.settings.mode;
      D=defaults();D.settings.theme=th;D.settings.mode=md;save();cur=thisKey();ensureMonth(cur);render()}}
  }
});
$('#fab').onclick=()=>expenseSheet();

/* Installation: the browser is asked to keep the data instead of clearing it
   when space runs low, the app works offline, and Android offers to add it to
   the home screen. */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
  const b=el('<button class="btn primary" style="position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:auto;z-index:40">Installer l\'app sur l\'écran d\'accueil</button>');
  b.onclick=async()=>{b.remove();deferred.prompt();deferred=null};
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),12000);
});

/* At startup the current month picks up any salary profile change made since
   it was created. */
ensureMonth(cur);
if(!D.months[cur].closed){
  const before=JSON.stringify(D.months[cur].incomes);
  syncSalary(D.months[cur],cur);
  if(JSON.stringify(D.months[cur].incomes)!==before)save();
}
applyTheme(D.settings.theme,D.settings.mode);
if(!persistent)$('#storewarn').classList.remove('hidden');
render();
bootBackup().then(armDailyBackup);
/* Pending changes are written to the backup folder as soon as the app goes to
   the background. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&dirH&&!booting&&D.settings.backup.auto!==false){clearTimeout(bTimer);writeBackup(false)}
});
</script>
</body>
</html>
