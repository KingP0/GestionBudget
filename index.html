      D.categories=D.categories.filter(x=>x.id!==c.id&&x.parent!==c.id);save();w.remove();render();
    };
  });
}
/* Fixed expenses and planned savings: created in every month on their debit
   day. A change applies from the current month onwards, closed months aside. */
function recSheet(id,defCat){
  const r=id?D.recurring.find(x=>x.id===id):null,saveCat=D.categories.find(c=>c.save);
  const catDef=r?r.catId:defCat==='save'&&saveCat?saveCat.id:'abo';
  sheet(r?'Modifier la dépense fixe':defCat==='save'?'Nouvelle épargne programmée':'Nouvelle dépense fixe',`
    <div class="field"><label for="l">Libellé</label><input id="l" value="${esc(r?r.label:'')}" placeholder="${defCat==='save'?'Virement Livret A…':'Loyer, abonnement, assurance…'}"></div>
    <div class="field"><label for="a">Montant</label><input id="a" inputmode="decimal" class="num" value="${r?String(r.amount).replace('.',','):''}"></div>
    <div class="field"><label for="dy">Jour du prélèvement</label><input id="dy" class="num" inputmode="numeric" value="${r?r.day||1:''}" placeholder="1 à 31"></div>
    <div class="field"><label for="f">Fréquence</label><select id="f">
      <option value="monthly" ${r&&r.freq==='monthly'?'selected':''}>Tous les mois</option>
      <option value="quarterly" ${r&&r.freq==='quarterly'?'selected':''}>Tous les 3 mois</option>
      <option value="yearly" ${r&&r.freq==='yearly'?'selected':''}>Une fois par an</option></select></div>
    <div class="field"><label for="c">Catégorie</label><select id="c">${catOptions(catDef)}</select></div>
    <label style="display:flex;gap:10px;align-items:center;padding:6px 0 14px"><input type="checkbox" id="ac" ${!r||r.active!==false?'checked':''} style="width:20px;height:20px;accent-color:var(--good)"><span>Active</span></label>
    <button class="btn primary" id="ok">Enregistrer</button>
    ${r?'<button class="btn ghost danger" id="del">Supprimer</button>':''}
    <div class="tiny muted" style="margin-top:12px">Les montants trimestriels et annuels sont lissés sur le mois pour ne pas fausser le budget.</div>`,
  w=>{
    w.querySelector('#ok').onclick=()=>{
      const o={label:w.querySelector('#l').value.trim()||'Dépense fixe',amount:r2(num(w.querySelector('#a').value)),
        day:Math.min(31,Math.max(1,Math.round(num(w.querySelector('#dy').value))||1)),
        freq:w.querySelector('#f').value,catId:w.querySelector('#c').value,active:w.querySelector('#ac').checked};
      if(o.amount<=0){w.querySelector('#a').focus();return toast('Indique un montant')}
      let rid;
      if(r){Object.assign(r,o);rid=r.id}else{rid=uid();D.recurring.push({id:rid,...o})}
      ensureMonth(thisKey());
      Object.keys(D.months).filter(k=>k>=thisKey()&&!D.months[k].closed).forEach(k=>{
        const m=D.months[k],ex=m.expenses.find(x=>x.rid===rid);
        const occ={label:o.label,amount:r2(monthlyAmount(o)),catId:o.catId,date:dayDate(k,o.day)};
        if(o.active&&!ex)m.expenses.push({id:uid(),...occ,rid});
        else if(ex){if(!o.active)m.expenses=m.expenses.filter(x=>x.id!==ex.id);else Object.assign(ex,occ)}
      });
      save();w.remove();render();toast(r?'Modification enregistrée':'Ajouté : '+esc(o.label));
    };
    const d=w.querySelector('#del');if(d)d.onclick=()=>{
      const pos=D.recurring.indexOf(r),removed=[];
      D.recurring.splice(pos,1);
      Object.keys(D.months).filter(k=>k>=thisKey()&&!D.months[k].closed).forEach(k=>{
        const m=D.months[k];m.expenses.filter(x=>x.rid===r.id).forEach(x=>removed.push([m,x]));
        m.expenses=m.expenses.filter(x=>x.rid!==r.id)});
      save();w.remove();render();
      toast('Supprimé : '+esc(r.label),()=>{D.recurring.splice(pos,0,r);removed.forEach(([m,x])=>m.expenses.push(x));save();render()});
    };
  });
}

/* Envelope change: for the chosen month only, or from that month onwards (the
   new amount then also becomes the default for months not created yet). */
function envFields(mk,val){
  return `<div class="field"><label for="envamt">Enveloppe mensuelle</label><input class="bigamount num" id="envamt" inputmode="decimal" value="${val?String(val).replace('.',','):''}" placeholder="aucune"></div>
    <div class="field"><label>S'applique</label><div class="seg"><button type="button" data-scope="from" aria-pressed="true">À partir de ${monthName(mk)}</button><button type="button" data-scope="only" aria-pressed="false">${capf(monthName(mk))} seulement</button></div></div>`;
}
function bindEnv(w,id,mk){
  let scope='from';
  w.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;w.querySelectorAll('[data-scope]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  w.querySelector('#envok').onclick=()=>{
    const raw=w.querySelector('#envamt').value.trim(),b=raw===''?null:r2(num(raw)),set=m=>{if(b===null)delete m.budgets[id];else m.budgets[id]=b};
    if(scope==='from'){catOf(id).budget=b;Object.keys(D.months).filter(k=>k>=mk&&!D.months[k].closed).forEach(k=>set(D.months[k]))}
    else set(ensureMonth(mk));
    save();w.remove();render();
    toast(`${esc(catOf(id).name)} : ${b===null?'sans enveloppe':eur(b)} ${scope==='from'?'à partir de '+monthName(mk):'pour '+monthName(mk)+' seulement'}`);
  };
}
function envSheet(id){
  const mk=thisKey(),c=catOf(id);if(!c)return;
  sheet(`${c.emoji} ${esc(c.name)}`,envFields(mk,envOf(ensureMonth(mk),id))+'<button class="btn primary" id="envok">Enregistrer</button>',w=>bindEnv(w,id,mk));
}
/* Category sheet, opened from an envelope: what is left, the last four months,
   this month's expenses, and the envelope edited in place. */
function ficheSheet(id){
  const c=catOf(id);if(!c)return;
  const m=ensureMonth(cur),b=envOf(m,id),s=varSpentOf(m,id),r=b?s/b:0,col=r>1?'var(--bad)':r>=D.settings.alert?'var(--warn)':'var(--good)';
  const hist=[3,2,1,0].map(i=>shiftKey(cur,-i)).filter(k=>D.months[k]).map(k=>({k,v:varSpentOf(D.months[k],id)}));
  const hm=Math.max(1,b,...hist.map(x=>x.v))*1.1;
  const ids=new Set([id,...kids(id).map(x=>x.id)]);
  const ops=m.expenses.filter(e=>!e.rid&&ids.has(e.catId)).sort((a,z)=>(z.date+z.id).localeCompare(a.date+a.id));
  sheet(`${c.emoji} ${esc(c.name)}`,`
    ${b?`<div class="tiny muted">${s<=b?'Il reste':'Dépassement de'}</div>
      <div class="serif num" style="font-size:40px;line-height:1.1;${s>b?'color:var(--bad)':''}">${eur(Math.abs(b-s))}</div>
      <div class="tiny muted">${eur(s)} dépensés sur ${eur(b)} en ${monthName(cur)}</div>
      <div class="pace"><div class="rail"><div class="fill" style="width:${Math.min(100,r*100)}%;background:${col}"></div></div></div>`
      :`<div class="serif num" style="font-size:40px;line-height:1.1">${eur(s)}</div><div class="tiny muted">dépensés en ${monthName(cur)}, sans enveloppe</div>`}
    ${hist.length>1?`<div class="field" style="margin-top:18px"><label>Les derniers mois</label>
      <div class="mini">${hist.map(x=>`<div class="b ${x.k===cur?'cur':''}"><i style="height:${Math.max(2,x.v/hm*60)}px"></i><span>${MONTHSHORT[+x.k.slice(5)-1]}</span></div>`).join('')}
        ${b?`<div class="capl" style="bottom:${18+b/hm*60}px"></div>`:''}</div>
      ${b?'<div class="tiny muted" style="margin-top:4px">Pointillés : l’enveloppe de ce mois.</div>':''}</div>`:''}
    <div class="field" style="margin-top:14px"><label>Dépenses de ${monthName(cur)}</label>${ops.length?`<div class="card">${ops.map(e=>opRow({...e,kind:'out'})).join('')}</div>`:'<div class="empty">Aucune dépense.</div>'}</div>
    ${m.closed?'':envFields(cur,b)+'<button class="btn primary" id="envok">Enregistrer l’enveloppe</button>'}`,
  w=>{if(!m.closed)bindEnv(w,id,cur)},true);
}

/* Folder backup (Chrome). The user picks a folder once; a single budget.json is
   rewritten there after every change, never as dated copies.
   - At startup the file is read back: a fresh install restores it silently, and
     a file newer than the device is restored only after the user agrees.
   - The file is never overwritten before it has been compared with the device.
   - If folder access is lost (app not installed), saving pauses until the user
     grants it again with one tap.
   - A folder synced by Drive or Syncthing shares the budget across devices. */
const FS_OK=typeof window.showDirectoryPicker==='function';
const SHARE_OK=!!(navigator.canShare&&navigator.share);
let dirH=null, bTimer=null, needAuth=false, booting=true, dailyArmed=false;

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('budget.fs',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('h')};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{
  const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbPut(k,v){try{const db=await idb();return await new Promise(res=>{
  const q=db.transaction('h','readwrite').objectStore('h').put(v,k);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}catch(e){return false}}
async function idbDel(k){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').delete(k)}catch(e){}}

async function granted(h,mode,ask){
  if(!h||!h.queryPermission)return !!h;
  try{
    if(await h.queryPermission({mode})==='granted')return true;
    if(!ask)return false;
    return await h.requestPermission({mode})==='granted';
  }catch(e){return false}
}
const backupName=()=>D.settings.backup.name||'budget.json';
async function fileH(create,ask){
  if(!dirH)return null;
  if(!await granted(dirH,'readwrite',ask))return null;
  try{return await dirH.getFileHandle(backupName(),{create:!!create})}catch(e){return null}
}
async function writeBackup(ask){
  if(!dirH)return false;
  try{
    const fh=await fileH(true,ask);if(!fh)return false;
    const w=await fh.createWritable();
    await w.write(JSON.stringify(D,null,2));
    await w.close();
    D.settings.backup.lastAt=new Date().toISOString();
    needAuth=false;saveLocal();
    if(ask)toast('Sauvegardé dans '+dirH.name);
    refreshSettings();
    return true;
  }catch(e){if(ask)toast("Écriture impossible dans ce dossier");return false}
}
function queueBackup(){
  if(!dirH||booting||D.settings.backup.auto===false)return;
  clearTimeout(bTimer);bTimer=setTimeout(()=>writeBackup(false),1200);
}
const isBudget=p=>!!(p&&typeof p==='object'&&Array.isArray(p.categories)&&p.categories.length&&p.months&&typeof p.months==='object');
async function readBackup(ask){
  const fh=await fileH(false,ask);if(!fh)return null;
  try{const t=await (await fh.getFile()).text();const p=JSON.parse(t);return isBudget(p)?p:null}
  catch(e){return null}
}
function adopt(p,msg){
  D=p;migrate();cur=thisKey();ensureMonth(cur);
  applyTheme(D.settings.theme,D.settings.mode);
  save({backup:false});render();toast(msg);
}
const hasData=()=>Object.keys(D.months||{}).some(k=>{const m=D.months[k];
  return m.expenses.length||m.incomes.some(i=>i.amount)});

async function chooseFolder(){
  let h;
  try{h=await showDirectoryPicker({id:'budget',mode:'readwrite',startIn:'documents'})}
  catch(e){return}
  dirH=h;await idbPut('dir',h);needAuth=false;booting=false;
  D.settings.backup.auto=true;
  D.settings.backup.daily=false;
  dailyArmed=false;
  /* If the chosen folder already holds a budget, the user decides which copy
     is kept: the folder's or the device's. */
  const p=await readBackup(true);
  if(p&&p.updatedAt&&(!hasData()||confirm('Ce dossier contient déjà une sauvegarde ('+whenTxt(p.updatedAt)+').\n\nOK : la récupérer sur cet appareil, en remplaçant les données actuelles.\nAnnuler : garder cet appareil et remplacer la sauvegarde du dossier.'))){
    adopt(p,'Données récupérées');return;
  }
  await writeBackup(true);render();
}
async function bootBackup(){
  if(!FS_OK){booting=false;return}
  dirH=await idbGet('dir');
  if(!dirH){booting=false;return}
  if(!await granted(dirH,'readwrite',false)){needAuth=true;booting=false;refreshSettings();return}
  const p=await readBackup(false);
  booting=false;
  if(!p){queueBackup();return}
  if(!hasData()){adopt(p,'Données récupérées du dossier');return}
  const mine=D.updatedAt||'',theirs=p.updatedAt||'';
  if(theirs>mine){
    if(confirm('La sauvegarde du dossier est plus récente ('+whenTxt(theirs)+'). Récupérer ces données ? Ce qui est sur cet appareil sera remplacé.'))
      adopt(p,'Données récupérées du dossier');
  }else if(mine>theirs)queueBackup();
}
async function reconnectFolder(){
  if(!dirH)return;
  if(await granted(dirH,'readwrite',true)){needAuth=false;await bootBackup();refreshSettings();toast('Dossier reconnecté')}
  else toast('Accès refusé');
}
async function forgetFolder(){
  dirH=null;needAuth=false;await idbDel('dir');render();toast('Dossier oublié');
}
function whenTxt(iso){
  const h=(Date.now()-new Date(iso))/36e5;
  if(!isFinite(h))return 'date inconnue';
  if(h<1)return "à l'instant";
  if(h<24)return 'il y a '+Math.max(1,Math.round(h))+' h';
  const j=Math.floor(h/24);
  return j===1?'hier':'il y a '+j+' jours';
}
function backupAge(){const l=D.settings.backup.lastAt;return l?Math.floor((Date.now()-new Date(l))/864e5):null}
/* Backup reminder: a banner on the Month screen after a chosen number of days
   without a backup (or never). */
function backupLate(){
  if(!hasData())return false;
  const rd=D.settings.backup.remindDays??7;
  if(!rd)return false;
  const a=backupAge();
  return a===null||a>=rd;
}
function refreshSettings(){if(sub==='reglages'&&!document.querySelector('.sheetwrap'))render()}

/* Daily download, for browsers that cannot write to a folder (Firefox, Safari
   on iOS). Once a day, on the first tap in the app, a dated backup is saved to
   the phone's Downloads folder; it waits for a tap because browsers block
   downloads the user did not trigger. A blocked download never stops that tap
   from working. It never runs where folder backup is available. */
function armDailyBackup(){
  const bk=D.settings.backup;
  if(FS_OK||dirH||!bk.daily||!hasData())return;
  const since=bk.lastAt?Date.now()-new Date(bk.lastAt):Infinity;
  if(since<20*36e5)return;
  dailyArmed=true;
}
function fireDailyBackup(){
  if(!dailyArmed)return;
  dailyArmed=false;
  try{exportJSON(true)}catch(e){}
}

/* Sharing sends the backup to Files, Drive or iCloud; browsers that cannot
   share files get a download instead. */
async function shareBackup(){
  const file=new File([JSON.stringify(D,null,2)],backupName(),{type:'application/json'});
  if(!(SHARE_OK&&navigator.canShare({files:[file]})))return exportJSON();
  try{
    await navigator.share({files:[file],title:'Sauvegarde Budget'});
    D.settings.backup.lastAt=new Date().toISOString();saveLocal();refreshSettings();
  }catch(e){}
}

function exportJSON(auto){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='budget-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  D.settings.backup.lastAt=new Date().toISOString();saveLocal();refreshSettings();
  toast(auto?'Sauvegarde du jour téléchargée':'Fichier exporté');
}
function importJSON(){
  const i=el('<input type="file" accept="application/json,.json" class="hidden">');
  document.body.appendChild(i);
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const p=JSON.parse(r.result);if(!isBudget(p))throw 0;
      if(!confirm('Remplacer les données actuelles par ce fichier ?'))return;
      adopt(p,'Données importées');}catch(e){alert("Ce fichier n'est pas une sauvegarde valide.")}
      i.remove()};
    r.readAsText(f)};
  i.click();
}
function bind(){
  const q=$('#opsq');if(q)q.oninput=()=>{opsQ=q.value;const p=q.selectionStart;render();const n=$('#opsq');n.focus();n.setSelectionRange(p,p)};
  const al=$('#alert');if(al)al.onchange=()=>{D.settings.alert=+al.value;save();render()};
  const cy=$('#carry');if(cy)cy.onchange=()=>{D.settings.carry=cy.checked;save();render()};
  const ba=$('#bauto');if(ba)ba.onchange=()=>{D.settings.backup.auto=ba.checked;save();if(ba.checked)writeBackup(true)};
  const br=$('#bremind');if(br)br.onchange=()=>{D.settings.backup.remindDays=+br.value;save();render()};
  const bd=$('#bdaily');if(bd)bd.onchange=()=>{
    D.settings.backup.daily=bd.checked;save();
    if(bd.checked)exportJSON(true);
    render();
  };
}
const LOCKED='Mois clôturé — rouvre-le pour modifier';
function go(v){view=v;sub=null;closeSheets();render();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{
  fireDailyBackup();
  const g=s=>ev.target.closest(s);
  let t;
  if(t=g('[data-nav]')){if(t.disabled)return;cur=shiftKey(cur,+t.dataset.nav);ensureMonth(cur);render();return}
  if(t=g('[data-year]')){if(t.disabled)return;anaYear+=+t.dataset.year;render();return}
  if(t=g('[data-tab]')){go(t.dataset.tab);return}
  if(g('[data-gear]')){sub='reglages';closeSheets();render();window.scrollTo(0,0);return}
  if(t=g('[data-sub]')){sub=t.dataset.sub;render();window.scrollTo(0,0);return}
  if(g('[data-back]')){sub=null;render();window.scrollTo(0,0);return}
  if(t=g('[data-amode]')){anaMode=t.dataset.amode;if(anaMode==='annee')anaYear=+cur.slice(0,4);render();return}
  if(t=g('[data-goto]')){cur=t.dataset.goto;ensureMonth(cur);anaMode='mois';render();window.scrollTo(0,0);return}
  if(t=g('[data-ft]')){opsType=t.dataset.ft;render();return}
  if(t=g('[data-fc]')){filterCat=t.dataset.fc;render();return}
  if(t=g('[data-fiche]')){ficheSheet(t.dataset.fiche);return}
  if(t=g('[data-envedit]')){envSheet(t.dataset.envedit);return}
  if(t=g('[data-exp]')){if(D.months[cur].closed)return toast(LOCKED);expenseSheet(t.dataset.exp);return}
  if(g('[data-salop]')){toast('Le salaire se règle dans Budget');return}
  if(g('[data-salary]')){salarySheet();return}
  if(t=g('[data-income]')){const mk=t.dataset.month||cur;if(ensureMonth(mk).closed)return toast(LOCKED);incomeSheet(t.dataset.income,mk);return}
  if(t=g('[data-catedit]')){catSheet(t.dataset.catedit);return}
  if(t=g('[data-rec]')){recSheet(t.dataset.rec);return}
  if(g('[data-close]')){const k=cur;D.months[k].closed=true;save();render();
    toast(capf(monthName(k))+' clôturé',()=>{D.months[k].closed=false;save();render()});return}
  if(g('[data-unlock]')){D.months[cur].closed=false;save();render();return}
  if(t=g('[data-theme]')){D.settings.theme=t.dataset.theme;applyTheme(D.settings.theme,D.settings.mode);save();render();return}
  if(t=g('[data-mode]')){D.settings.mode=t.dataset.mode;applyTheme(D.settings.theme,D.settings.mode);save();render();return}
  if(t=g('[data-act]')){
    const a=t.dataset.act;
    if(a==='income-add')incomeSheet(null,thisKey());
    else if(a==='cat-add')catSheet();
    else if(a==='rec-add')recSheet();
    else if(a==='save-add')recSheet(null,'save');
    else if(a==='export')exportJSON();
    else if(a==='import')importJSON();
    else if(a==='bfolder')chooseFolder();
    else if(a==='bsave')writeBackup(true);
    else if(a==='reauth')reconnectFolder();
    else if(a==='bshare')shareBackup();
    else if(a==='bforget'){if(confirm('Oublier ce dossier ? Le fichier déjà écrit reste en place, mais la sauvegarde automatique s\'arrête.'))forgetFolder()}
    else if(a==='bload')(async()=>{
      const p=await readBackup(true);
      if(!p)return toast('Aucune sauvegarde lisible dans ce dossier');
      if(confirm('Remplacer les données de cet appareil par la sauvegarde du '+new Date(p.updatedAt||Date.now()).toLocaleString('fr-FR')+' ?'))adopt(p,'Données récupérées');
    })();
    else if(a==='reset'){if(confirm('Effacer toutes les données, y compris les mois passés ?')){
      const th=D.settings.theme,md=D.settings.mode;
      D=defaults();D.settings.theme=th;D.settings.mode=md;save();cur=thisKey();ensureMonth(cur);render()}}
  }
});
$('#fab').onclick=()=>addSheet();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});
/* On the Month screen, swiping left or right moves to the next or previous month. */
let swipeX=null,swipeY=null;
$('#app').addEventListener('touchstart',e=>{if(view!=='mois'||sub)return;swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY},{passive:true});
$('#app').addEventListener('touchend',e=>{
  if(swipeX===null)return;
  const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;swipeX=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const k=shiftKey(cur,dx<0?1:-1);
  if(dx<0&&k>shiftKey(thisKey(),12))return;
  cur=k;ensureMonth(cur);render();
},{passive:true});

/* Installation: the browser is asked to keep the data instead of clearing it
   when space runs low, the app works offline, and Android offers to add it to
   the home screen. */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
  const b=el('<button class="btn primary" style="position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));width:auto;z-index:40">Installer l\'app sur l\'écran d\'accueil</button>');
  b.onclick=async()=>{b.remove();deferred.prompt();deferred=null};
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),12000);
});

/* At startup the current month picks up any salary profile change made since
   it was created. */
ensureMonth(cur);
if(!D.months[cur].closed){
  const before=JSON.stringify(D.months[cur].incomes);
  syncSalary(D.months[cur],cur);
  if(JSON.stringify(D.months[cur].incomes)!==before)save();
}
applyTheme(D.settings.theme,D.settings.mode);
if(!persistent)$('#storewarn').classList.remove('hidden');
render();
/* Home-screen shortcut (long press on the app icon, Android): opens straight on
   the add sheet. */
if(new URLSearchParams(location.search).has('add')){history.replaceState(null,'',location.pathname);addSheet()}
bootBackup().then(armDailyBackup);
/* Pending changes are written to the backup folder as soon as the app goes to
   the background. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&dirH&&!booting&&D.settings.backup.auto!==false){clearTimeout(bTimer);writeBackup(false)}
});
</script>
</body>
</html>
