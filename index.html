<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F2420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Budget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0F2420;
  --surface:#16302A;
  --surface-2:#1C3B34;
  --line:#2B5247;
  --ink:#EAF2EB;
  --ink-2:#9AB4A8;
  --ink-3:#6C8A7E;
  --good:#8ED6A9;
  --warn:#E9B45A;
  --bad:#E97D63;
  --on-accent:#0C2019;
  --on-warn:#231602;
  --tabbg:#0F2420;
  --scrim:rgba(6,16,14,.62);
  --shadow:rgba(0,0,0,.45);
  --radius:14px;
  --gut:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{min-height:calc(100% + env(safe-area-inset-top))}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* On iPhone the app runs edge to edge: content stays clear of the status bar,
   the notch and the home indicator, and the page always fills the whole screen
   so the tab bar sits on the bottom edge even when a screen has little content. */
#app{max-width:540px;margin:0 auto;padding:0 max(var(--gut),env(safe-area-inset-right)) 0 max(var(--gut),env(safe-area-inset-left))}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--good);outline-offset:1px;border-color:transparent}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.hidden,[hidden]{display:none!important}

/* Month header */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 78%,transparent);padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:grid;grid-template-columns:38px 38px 1fr 38px 38px;align-items:center;gap:4px}
.topbar h1{font-size:18px;text-align:center;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.plain{grid-template-columns:38px 1fr 38px}
.topbar.plain h1{text-align:left;font-size:22px;text-transform:none}
.topbar .subt{grid-column:1/3;font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.navbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);font-size:19px;border:1px solid var(--line)}
.navbtn:active{background:var(--surface)}
.navbtn[disabled]{opacity:.3}
.navbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Month summary card */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;margin-bottom:14px}
.hero .label{font-size:13.5px;color:var(--ink-2)}
.hero .amount{font-size:52px;line-height:1.05;margin:4px 0 2px;display:block}
.hero .sub{font-size:13.5px;color:var(--ink-2)}
.pace{margin-top:18px}
.pace .rail{position:relative;height:10px;border-radius:6px;background:var(--surface-2);overflow:visible;border:1px solid var(--line)}
.pace .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--good);transition:width .35s ease}
.pace .today{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.pace .today::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.pace .cap{margin-top:9px;font-size:13px;color:var(--ink-2)}
.split{display:flex;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.split div{flex:1}
.split .k{font-size:12.5px;color:var(--ink-3)}
.split .v{font-size:16px;margin-top:1px}

/* Envelopes, expenses and lists */
section{margin-bottom:22px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 9px}
.sechead h2{font-size:17px}
.sechead button{font-size:13px;color:var(--good)}

.alert{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-left:3px solid var(--warn);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:8px;font-size:13.5px}
.alert.over{border-left-color:var(--bad)}
.alert .ico{font-size:15px;line-height:1.3}

.env{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:none}
.env .row1{display:flex;align-items:baseline;gap:9px}
.env .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env .amt{font-size:14px}
.env .rail{height:5px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.env .fill{height:100%;border-radius:3px;background:var(--good)}
.env .sub{font-size:12.5px;color:var(--ink-3);margin-top:5px;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px}

.exp{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left}
.exp:last-child{border-bottom:none}
.exp .em{width:34px;height:34px;flex:none;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px}
.exp .mid{flex:1;min-width:0}
.exp .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .s{font-size:12.5px;color:var(--ink-3)}
.exp .v{font-size:15px}
.daylabel{font-size:12.5px;color:var(--ink-3);margin:16px 2px 2px}

.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding:0 2px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%}
.bars .bi{border-radius:3px 3px 0 0;background:var(--good);min-height:2px}
.bars .bl{font-size:10px;color:var(--ink-3);text-align:center}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile .k{font-size:12.5px;color:var(--ink-2)}
.tile .v{font-size:21px;margin-top:2px}

.item{display:flex;align-items:center;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item:last-child{border-bottom:none}
.item .mid{flex:1;min-width:0}
.item .s{font-size:12.5px;color:var(--ink-3)}
.item.child{padding-left:22px}
.item.child .mid::before{content:"└ ";color:var(--ink-3)}

.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:500}
.btn.primary{background:var(--good);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn+.btn{margin-top:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--good);color:var(--on-accent);border-color:transparent;font-weight:600}
.chip.sm{padding:6px 10px;font-size:12.5px}

/* Theme picker */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.sw{border:1px solid var(--line);border-radius:13px;padding:11px 3px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;line-height:1.2}
.sw .dot{width:22px;height:22px;border-radius:50%}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Tab bar and add-expense button */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--tabbg);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink-3)}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--good)}
.fab{position:fixed;z-index:31;right:max(18px,calc(50% - 270px + 18px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:19px;background:var(--good);color:var(--on-accent);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 22px var(--shadow)}
.fab:active{transform:scale(.94)}

/* Bottom sheets and notifications */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:540px;max-height:92vh;max-height:calc(100dvh - env(safe-area-inset-top) - 16px);overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:8px var(--gut) calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(18px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pace .fill{transition:none}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:19px;margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.bigamount{font-size:38px!important;text-align:center;padding:14px!important;font-family:"Instrument Serif",Georgia,serif}
.rowbtns{display:flex;gap:9px;margin-top:6px}
.rowbtns .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:13.5px;font-weight:500;box-shadow:0 6px 18px var(--shadow);max-width:calc(100% - 32px);text-align:center}
.warnbar{background:var(--warn);color:var(--on-warn);padding:calc(9px + env(safe-area-inset-top)) 14px 9px;font-size:13px;text-align:center}
.empty{text-align:center;color:var(--ink-2);padding:26px 10px;font-size:14px}

/* Month screen additions */
.proj{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.lock{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.lock button,.lnk{color:var(--good);font-weight:500}
.bilan{background:var(--surface);border:1px solid var(--good);border-radius:18px;padding:15px 16px;margin-bottom:12px}
.bilan h3{font-size:17px;margin-bottom:4px}
.bilan .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 14px}
.bilan .kv .k{font-size:12px;color:var(--ink-3)}
.bilan .kv .v{font-size:16px}
.exp.planned .t,.exp.planned .v{color:var(--ink-2)}
.exp.planned .em{background:transparent;border:1px dashed var(--line)}
.exp .em.in{color:var(--good);font-weight:600}

/* Operations screen */
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1*var(--gut));padding:0 var(--gut) 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips .chip{flex:none;white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px 0;border-radius:9px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}

/* Analysis screen: year view */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 8px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart .leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);padding:6px 8px 2px}
.chart .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.stat3 .tile{padding:10px 11px}
.stat3 .v{font-size:18px}
.tip{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;font-size:14px}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin-top:10px}

/* Budget screen */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;margin-bottom:18px}
.plan .amount{font-size:38px;line-height:1.1;margin:2px 0;display:block}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 12px;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.legend span:nth-child(odd){display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.legend .swc{width:10px;height:10px;border-radius:3px;flex:none}

/* Add sheet, category sheet, undo */
.favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*var(--gut));padding:0 var(--gut)}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:12px;border:1px dashed var(--line);background:var(--surface);font-size:13.5px;text-align:left}
.fav small{color:var(--ink-3);font-size:12px}
.sugg{margin-top:6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border-bottom:0}
.sugg button span:last-child{color:var(--ink-3);font-size:12.5px}
.mini{display:flex;align-items:flex-end;gap:10px;height:86px;padding:8px 4px 0;position:relative}
.mini .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.mini .b i{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--surface-2);border:1px solid var(--line)}
.mini .b.cur i{background:var(--good);border-color:transparent}
.mini .b span{font-size:11px;line-height:14px;color:var(--ink-3)}
.mini .capl{position:absolute;left:0;right:0;border-top:1px dashed var(--warn)}
.toast.undo{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;white-space:nowrap}
.toast.undo button{color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:2px 6px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btns2 .btn{margin-top:0}
</style>
<script>
/* Themes: eight hues, each available in dark or light mode. The whole palette
   is derived from the hue, so every combination stays readable. The saved theme
   is applied before the page appears, so the app never flashes the default green. */
const THEMES=[
  {id:'vert',    name:'Vert',     h:167},
  {id:'ocean',   name:'Océan',    h:191},
  {id:'bleu',    name:'Bleu',     h:216},
  {id:'violet',  name:'Violet',   h:266},
  {id:'rose',    name:'Rose',     h:329},
  {id:'rouge',   name:'Rouge',    h:6,   bad:'#FF8FA8'},
  {id:'ambre',   name:'Ambre',    h:36,  warn:'#D8CF5F'},
  {id:'graphite',name:'Graphite', h:222, sat:.10}
];
function hsl2hex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const b=n=>Math.round(255*f(n)).toString(16).padStart(2,'0');
  return '#'+b(0)+b(8)+b(4);
}
function palette(id,mode){
  const t=THEMES.find(x=>x.id===id)||THEMES[0];
  const k=t.sat==null?1:t.sat;
  const C=(s,l)=>hsl2hex(t.h,Math.round(s*k),l);
  if(mode==='clair'){
    const bg=C(30,97);
    return {bg,surface:'#FFFFFF','surface-2':C(26,95),line:C(20,86),
      ink:C(34,13),'ink-2':C(14,30),'ink-3':C(12,41),
      good:C(58,31),warn:t.warn?'#7A5E00':'#8A5A00',bad:'#B33A2B',
      'on-accent':'#FFFFFF','on-warn':'#FFFFFF',
      tabbg:'#FFFFFF',scrim:'rgba(24,32,30,.38)',shadow:'rgba(20,30,28,.16)',scheme:'light'};
  }
  const bg=C(40,10);
  return {bg,surface:C(36,14),'surface-2':C(35,17),line:C(30,25),
    ink:C(22,93),'ink-2':C(16,68),'ink-3':C(14,59),
    good:C(48,70),warn:t.warn||'#E9B45A',bad:t.bad||'#EE8872',
    'on-accent':C(45,10),'on-warn':'#231602',
    tabbg:bg,scrim:'rgba(6,14,12,.62)',shadow:'rgba(0,0,0,.45)',scheme:'dark'};
}
function applyTheme(id,mode){
  const p=palette(id,mode),r=document.documentElement;
  for(const k in p) if(k!=='scheme') r.style.setProperty('--'+k,p[k]);
  r.style.colorScheme=p.scheme;
  const mt=document.querySelector('meta[name=theme-color]');
  if(mt)mt.setAttribute('content',p.bg);
  const sb=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');
  if(sb)sb.setAttribute('content',p.scheme==='light'?'default':'black-translucent');
}
try{
  const s=JSON.parse(localStorage.getItem('budget.v1')||'{}').settings||{};
  applyTheme(s.theme||'vert',s.mode||'sombre');
}catch(e){}
</script>
</head>
<body>
<div id="storewarn" class="warnbar hidden">Le navigateur bloque l'enregistrement local. Les données seront perdues à la fermeture — ouvre le fichier depuis un serveur ou exporte régulièrement.</div>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Ajouter une dépense">+</button>
<nav class="tabs" id="tabs"></nav>
<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const uid=()=>Math.random().toString(36).slice(2,9);
const num=(x)=>{const v=parseFloat(String(x??'').replace(',','.').replace(/[^\d.-]/g,''));return isFinite(v)?v:0};
const eur=(n,dec)=>{const d=dec??(Math.abs(n%1)>0.004?2:0);return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n)};
const pct=(x)=>Math.round(x*100)+' %';
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KEY='budget.v1';
let persistent=true;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){persistent=false;$('#storewarn').classList.remove('hidden')}}
/* Every change is stored on the device right away, then copied to the backup
   folder when one is connected. */
function save(opt){
  D.updatedAt=new Date().toISOString();
  saveLocal();
  if(!opt||opt.backup!==false)queueBackup();
}
function loadRaw(){try{return localStorage.getItem(KEY)}catch(e){persistent=false;$('#storewarn').classList.remove('hidden');return null}}

const APP_VERSION='1.2';
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const today=()=>new Date();
const thisKey=()=>keyOf(today());
const todayISO=()=>thisKey()+'-'+pad(today().getDate());
const yesterdayISO=()=>{const d=new Date(Date.now()-864e5);return keyOf(d)+'-'+pad(d.getDate())};
function shiftKey(k,n){const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return keyOf(d)}
function daysIn(k){const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
const dayDate=(k,d)=>k+'-'+pad(Math.min(Math.max(1,+d||1),daysIn(k)));
const isLater=date=>(date||'')>todayISO();
function labelOf(k){const[y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}
function shortLabel(k){const[y,m]=k.split('-').map(Number);return new Intl.DateTimeFormat('fr-FR',{month:'short'}).format(new Date(y,m-1,1)).replace('.','')}
function dayLabel(iso){const d=new Date(iso+'T12:00');const t=new Date();const y=new Date(Date.now()-864e5);
  if(d.toDateString()===t.toDateString())return "Aujourd'hui";
  if(d.toDateString()===y.toDateString())return "Hier";
  return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(d)}

/* A new budget starts with everyday categories; Savings is counted apart from
   spending. */
function defaults(){
  const C=(id,name,emoji,budget,extra={})=>({id,name,emoji,budget,parent:null,...extra});
  return {v:3,
    settings:{alert:.8,carry:true,theme:'vert',mode:'sombre',
      salary:{label:'Salaire net',net:0,months:12,mode:'reel',bonusLabel:'13ᵉ mois',parts:[],payDay:28},
      backup:{auto:true,daily:false,name:'budget.json',lastAt:null,remindDays:7}},
    categories:[
      C('alim','Alimentaire','🛒',null),
      C('resto','Restaurants & bars','🍜',null),
      C('abo','Abonnements','🔁',null),
      C('logement','Logement','🏠',null),
      C('transport','Transport','🚆',null),
      C('sante','Santé','➕',null),
      C('loisirs','Loisirs','🎮',null),
      C('shopping','Achats','👕',null),
      C('divers','Divers','✳️',null),
      C('epargne','Épargne','🏦',null,{save:true})
    ],
    recurring:[],
    months:{}
  };
}
let D=(()=>{const r=loadRaw();if(!r)return defaults();try{const p=JSON.parse(r);return p&&p.categories?p:defaults()}catch(e){return defaults()}})();
let cur=thisKey(), view='mois', sub=null, anaMode='mois', anaYear=+thisKey().slice(0,4);

/* Data from an older version or a damaged backup file still opens: missing
   parts are restored instead of breaking the app. */
function repair(){
  if(!D||typeof D!=='object')D=defaults();
  if(!D.settings||typeof D.settings!=='object')D.settings={};
  if(!Array.isArray(D.categories)||!D.categories.length)D.categories=defaults().categories;
  if(!Array.isArray(D.recurring))D.recurring=[];
  if(!D.months||typeof D.months!=='object')D.months={};
  Object.keys(D.months).forEach(k=>{
    const m=D.months[k];
    if(!m||typeof m!=='object'){delete D.months[k];return}
    if(!Array.isArray(m.incomes))m.incomes=[];
    if(!Array.isArray(m.expenses))m.expenses=[];
    if(!m.budgets||typeof m.budgets!=='object')m.budgets={};
    m.closed=!!m.closed;
  });
}
/* Upgrade from the first version: the salary typed in month by month becomes
   the yearly salary profile, without being counted twice. */
function migrate(){
  repair();
  const s=D.settings;
  if(!(D.v>=2)){
    const keys=Object.keys(D.months||{}).sort();
    const isSal=i=>/salaire|paie|paye/i.test(i.label||'');
    let net=0;
    for(const k of keys.slice().reverse()){
      const inc=D.months[k].incomes||[];
      const sal=inc.find(isSal)||(inc.length===1?inc[0]:null);
      if(sal&&sal.amount>0){net=sal.amount;break}
    }
    keys.forEach(k=>{
      const inc=D.months[k].incomes||[];
      const sal=inc.find(isSal)||(inc.length===1?inc[0]:null);
      if(sal)sal.sid='base';
      inc.forEach(i=>{if(!i.sid&&i.keep===undefined)i.keep=true});
    });
    s.salary={label:'Salaire net',net,months:12,mode:'reel',bonusLabel:'13ᵉ mois',parts:[]};
    D.v=2;
  }
  s.theme=s.theme||'vert';
  s.mode=s.mode||'sombre';
  if(!s.salary)s.salary={label:'Salaire net',net:0,months:12,mode:'reel',bonusLabel:'13ᵉ mois',parts:[]};
  if(!s.salary.payDay)s.salary.payDay=28;
  /* Version 1.2: fixed expenses have a debit day and incomes a date, so the app
     can tell what has already happened from what is still to come this month. */
  if(!(D.v>=3)){
    D.recurring.forEach(r=>{if(!r.day)r.day=1});
    Object.keys(D.months).forEach(k=>D.months[k].incomes.forEach(i=>{
      if(!i.date)i.date=dayDate(k,i.sid?s.salary.payDay:1)}));
    D.v=3;
  }
  if(!s.backup)s.backup={auto:true,daily:false,name:'budget.json',lastAt:null,remindDays:7};
  if(s.alert==null)s.alert=.8;
  if(s.carry==null)s.carry=true;
}
migrate();

const catOf=id=>D.categories.find(c=>c.id===id);
const kids=id=>D.categories.filter(c=>c.parent===id);
const roots=()=>D.categories.filter(c=>!c.parent);
function rootOf(id){let c=catOf(id);let g=0;while(c&&c.parent&&g++<6)c=catOf(c.parent);return c}
const isSave=id=>{const r=rootOf(id);return !!(r&&r.save)};
const catPath=id=>{const c=catOf(id);if(!c)return'Supprimée';const p=c.parent?catOf(c.parent):null;return p?p.name+' · '+c.name:c.name};
const emojiOf=id=>{const c=catOf(id);return (c&&c.emoji)||(rootOf(id)||{}).emoji||'•'};

function monthlyAmount(r){return r.freq==='yearly'?r.amount/12:r.freq==='quarterly'?r.amount/3:r.amount}
function freqLabel(r){return r.freq==='yearly'?'annuel, lissé':r.freq==='quarterly'?'trimestriel, lissé':'mensuel'}

/* Salary profile: a monthly net pay plus optional extra months (13th, 14th)
   paid on any months of the year, counted either on the months they are paid
   or spread evenly over twelve months. Each month's salary lines come from the
   profile; incomes entered by hand (bonus, refund) are never changed by it. */
const MONTHNAMES=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MONTHSHORT=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
const frList=a=>a.length>1?a.slice(0,-1).join(', ')+' et '+a[a.length-1]:(a[0]||'');
const r2=x=>+(+x||0).toFixed(2);
const SAL=()=>D.settings.salary;
function bonusTotal(s){return (s.parts||[]).reduce((a,p)=>a+(+p.amount||0),0)}
function salaryYear(s){return r2(s.net*12+bonusTotal(s))}
function salaryLines(k){
  const s=SAL(),mo=+k.slice(5,7),out=[],date=dayDate(k,s.payDay||28);
  if(s.mode==='lisse'){
    out.push({sid:'base',label:s.label||'Salaire net',amount:r2(s.net+bonusTotal(s)/12),date,smoothed:bonusTotal(s)>0});
  }else{
    out.push({sid:'base',label:s.label||'Salaire net',amount:r2(s.net),date});
    (s.parts||[]).filter(p=>+p.month===mo&&+p.amount).forEach(p=>{
      out.push({sid:'p'+p.month,label:s.bonusLabel||'13ᵉ mois',amount:r2(p.amount),date});
    });
  }
  return out;
}
function syncSalary(m,k){
  const want=salaryLines(k),manual=m.incomes.filter(i=>!i.sid);
  m.incomes=want.map(w=>{
    const old=m.incomes.find(i=>i.sid===w.sid);
    return {id:old?old.id:uid(),...w};
  }).concat(manual);
}
/* The budget plan (salary, fixed expenses, envelopes) applies from the current
   month onwards; past and closed months keep what actually happened. */
function syncSalaryForward(from=thisKey()){
  Object.keys(D.months).forEach(k=>{if(k>=from&&!D.months[k].closed)syncSalary(D.months[k],k)});
}
function salarySummary(){
  const s=SAL(),bt=bonusTotal(s);
  if(!s.net&&!bt)return 'à configurer';
  if(!bt)return '12 mois';
  const nb=s.net?Math.round((12+bt/s.net)*10)/10:0;
  const lab=nb?String(nb).replace('.',',')+' mois':eur(bt)+' en plus';
  if(s.mode==='lisse')return lab+', lissé sur l\'année';
  const n=(s.parts||[]).filter(p=>+p.amount).map(p=>MONTHNAMES[+p.month-1]);
  return lab+' · '+(frList(n)||'—');
}

/* A new month starts with the salary, the incomes marked as monthly, the
   envelopes and the recurring expenses. */
function ensureMonth(k){
  if(D.months[k])return D.months[k];
  const prev=D.months[shiftKey(k,-1)];
  const m={incomes:prev?prev.incomes.filter(i=>!i.sid&&i.keep!==false)
             .map(i=>({...i,id:uid(),date:dayDate(k,(i.date||'').slice(8,10))})):[],
           budgets:{},expenses:[],closed:false};
  syncSalary(m,k);
  D.categories.forEach(c=>{if(c.budget!=null)m.budgets[c.id]=c.budget});
  D.recurring.filter(r=>r.active!==false).forEach(r=>{
    m.expenses.push({id:uid(),label:r.label,amount:+monthlyAmount(r).toFixed(2),catId:r.catId,date:dayDate(k,r.day),rid:r.id});
  });
  D.months[k]=m;save();return m;
}

function envOf(m,id){
  if(m.budgets[id]!=null)return m.budgets[id];
  const ks=kids(id);
  if(!ks.length)return 0;
  return ks.reduce((s,c)=>s+(m.budgets[c.id]??0),0);
}
function spentOf(m,id){
  const ids=new Set([id,...kids(id).map(c=>c.id)]);
  return m.expenses.reduce((s,e)=>ids.has(e.catId)?s+e.amount:s,0);
}
function rawTotals(m){
  let income=m.incomes.reduce((s,i)=>s+i.amount,0),expense=0,saving=0;
  m.expenses.forEach(e=>{isSave(e.catId)?saving+=e.amount:expense+=e.amount});
  return {income,expense,saving};
}
/* Balance carry-over (optional): what is left at the end of a month is added to
   the next one, and overspending is deducted from it. */
function carryFor(k){
  if(!D.settings.carry)return 0;
  const keys=Object.keys(D.months).sort();let acc=0;
  for(const kk of keys){
    if(kk>=k)break;
    const t=rawTotals(D.months[kk]);
    acc+=t.income-t.expense-t.saving;
  }
  return acc;
}
/* Envelopes cover variable spending only: fixed expenses (loyer, abonnements)
   are tracked on their own, so salary − fixed − envelopes − savings adds up. */
function varSpentOf(m,id){
  const ids=new Set([id,...kids(id).map(c=>c.id)]);
  return m.expenses.reduce((s,e)=>ids.has(e.catId)&&!e.rid?s+e.amount:s,0);
}
function totals(k){
  const m=D.months[k];const t=rawTotals(m);const carry=carryFor(k);
  let variable=0,fixed=0,done=0,upOut=0,upSave=0,upIn=0;
  m.expenses.forEach(e=>{
    const sv=isSave(e.catId),later=isLater(e.date);
    if(!sv){e.rid?fixed+=e.amount:variable+=e.amount; later?upOut+=e.amount:done+=e.amount}
    else if(later)upSave+=e.amount;
  });
  m.incomes.forEach(i=>{if(isLater(i.date))upIn+=i.amount});
  return {...t,carry,left:t.income+carry-t.expense-t.saving,variable,fixed,done,upOut,upSave,upIn};
}
function envTotal(m){return roots().filter(c=>!c.save).reduce((s,c)=>s+envOf(m,c.id),0)}
/* The plan behind the Budget screen, as it applies to the current month. */
function planOf(){
  const k=thisKey(),m=ensureMonth(k),s=SAL(),act=D.recurring.filter(r=>r.active!==false);
  const salary=r2(s.net+(s.mode==='lisse'?bonusTotal(s)/12:0));
  const regular=m.incomes.filter(i=>!i.sid&&i.keep!==false).reduce((a,i)=>a+i.amount,0);
  const fixed=act.filter(r=>!isSave(r.catId)).reduce((a,r)=>a+monthlyAmount(r),0);
  const saving=act.filter(r=>isSave(r.catId)).reduce((a,r)=>a+monthlyAmount(r),0);
  const env=envTotal(m),income=salary+regular;
  return {income,salary,regular,fixed,saving,env,free:income-fixed-saving-env};
}

/* Four tabs, each with one job: Mois (where I stand), Opérations (what
   happened), Analyse (understand, month or year), Budget (my plan). Settings
   and categories open as pages behind the header, not as tabs. */
const IC={
  mois:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  ops:'<path d="M3 7h18v12H3z"/><path d="M3 11h18"/>',
  analyse:'<path d="M5 20V9M12 20V4M19 20v-7"/>',
  budget:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const svg=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
function render(){
  const m=ensureMonth(cur);
  const body=sub==='reglages'?viewReglages():sub==='categories'?viewCategories():
    view==='mois'?viewMois(m):view==='ops'?viewOps(m):view==='analyse'?viewAnalyse(m):viewBudget();
  $('#app').innerHTML=topbar()+body;
  renderTabs();
  $('#fab').classList.toggle('hidden',!!sub||view==='budget'||(m.closed&&view!=='analyse'));
  bind();
}
function topbar(){
  if(sub)return `<div class="topbar plain"><button class="navbtn" data-back aria-label="Retour">${svg(IC.back)}</button>
    <h1>${sub==='reglages'?'Réglages':'Catégories'}</h1><span></span></div>`;
  const gear=`<button class="navbtn" data-gear aria-label="Réglages">${svg(IC.gear)}</button>`;
  if(view==='budget')return `<div class="topbar plain"><h1 style="grid-column:1/3">Budget</h1>${gear}
    <div class="subt">Ton plan, à partir de ${labelOf(thisKey())}</div></div>`;
  if(view==='analyse'&&anaMode==='annee'){
    const next=anaYear<+thisKey().slice(0,4)+1;
    return `<div class="topbar"><span></span><button class="navbtn" data-year="-1" aria-label="Année précédente">‹</button>
      <h1>Année ${anaYear}</h1><button class="navbtn" data-year="1" ${next?'':'disabled'} aria-label="Année suivante">›</button>${gear}</div>`;
  }
  const next=shiftKey(cur,1)<=shiftKey(thisKey(),12);
  return `<div class="topbar"><span></span>
    <button class="navbtn" data-nav="-1" aria-label="Mois précédent">‹</button>
    <h1>${labelOf(cur)}</h1>
    <button class="navbtn" data-nav="1" ${next?'':'disabled'} aria-label="Mois suivant">›</button>${gear}</div>`;
}
function renderTabs(){
  const T=[['mois','Mois'],['ops','Opérations'],['analyse','Analyse'],['budget','Budget']];
  $('#tabs').innerHTML=T.map(([id,lb])=>`<button data-tab="${id}" aria-selected="${!sub&&view===id}">${svg(IC[id])}${lb}</button>`).join('');
}

const capf=s=>s.charAt(0).toUpperCase()+s.slice(1);
const monthName=k=>MONTHNAMES[+k.slice(5,7)-1];
const monthState=k=>k<thisKey()?'past':k===thisKey()?'cur':'future';
/* Every movement of a month, expenses and incomes alike, in one list. */
function monthItems(m){
  return [...m.expenses.map(e=>({...e,kind:'out'})),...m.incomes.map(i=>({...i,kind:'in'}))];
}
function opRow(o){
  const inc=o.kind==='in',later=isLater(o.date),d=+(o.date||'').slice(8,10);
  const what=inc?(o.sid?'salaire':'revenu'):catPath(o.catId)+(o.rid?' · fixe':'');
  const attr=inc?(o.sid?'data-salop':`data-income="${o.id}"`):`data-exp="${o.id}"`;
  return `<button class="exp${later?' planned':''}" ${attr}>
    ${inc?'<span class="em in">+</span>':`<span class="em">${emojiOf(o.catId)}</span>`}
    <span class="mid"><span class="t">${esc(o.label||catPath(o.catId))}</span>
    <span class="s">${later?`prévu le ${d} · `:''}${esc(what)}</span></span>
    <span class="v num ${inc?'good':''}">${inc?'+'+eur(o.amount):eur(o.amount)}</span></button>`;
}

/* Month screen: money left to live on, the projection at the current pace,
   envelope alerts, what is still to come, and at the end of a month its
   summary with the option to close it. */
function viewMois(m){
  const k=cur,t=totals(k),st=monthState(k),bt=envTotal(m),ratio=bt?t.variable/bt:0;
  const dayR=st==='cur'?today().getDate()/daysIn(k):st==='past'?1:0;
  const color=ratio>1?'var(--bad)':(st==='cur'&&ratio>dayR+.06?'var(--warn)':'var(--good)');
  const envCats=roots().filter(c=>!c.save&&(envOf(m,c.id)>0||varSpentOf(m,c.id)>0));
  let out='';
  if(m.closed)out+=`<div class="lock"><span>🔒 ${capf(monthName(k))} est clôturé.</span><button data-unlock>Rouvrir</button></div>`;
  else if(st==='past'){
    const withEnv=envCats.filter(c=>envOf(m,c.id)>0),ok=withEnv.filter(c=>varSpentOf(m,c.id)<=envOf(m,c.id)).length;
    out+=`<div class="bilan"><h3>${capf(monthName(k))} est terminé</h3>
      <div class="tiny muted">Vérifie qu'il ne manque rien, puis fige ses chiffres : les changements de budget ne le modifieront plus.</div>
      <div class="kv"><div><div class="k">Mis de côté</div><div class="v num">${eur(t.saving)}</div></div>
        <div><div class="k">Il t'est resté</div><div class="v num ${t.left<0?'bad':''}">${eur(t.left)}</div></div>
        <div><div class="k">Enveloppes tenues</div><div class="v num">${ok} sur ${withEnv.length}</div></div></div>
      <button class="btn primary" data-close>Clôturer ${monthName(k)}</button></div>`;
  }
  if(backupLate())out+=`<div class="alert" style="border-left-color:var(--ink-2)"><span class="ico">💾</span><div>${
      D.settings.backup.lastAt?`Aucune sauvegarde depuis ${backupAge()} jours.`:`Tes données ne sont enregistrées que sur cet appareil.`}
      <button class="lnk" ${dirH&&!needAuth?'data-act="bsave"':'data-gear'}>${dirH&&!needAuth?'Sauvegarder':'Configurer'}</button></div></div>`;

  let cap,proj='',split;
  if(!bt)cap='Aucune enveloppe : fixe-les dans Budget pour suivre ton rythme.';
  else if(st==='cur')cap=(ratio>dayR+.06?'Tu dépenses plus vite que le mois ne passe — ':'Rythme tenu — ')+`${pct(ratio)} des enveloppes utilisées, ${pct(dayR)} du mois écoulé.`;
  else if(st==='past')cap=`${pct(ratio)} des enveloppes utilisées sur le mois.`;
  else cap='Le mois n’a pas commencé.';
  if(st==='cur'){
    const d=today().getDate(),rest=daysIn(k)-d;
    const spentVar=m.expenses.filter(e=>!e.rid&&!isSave(e.catId)&&!isLater(e.date)).reduce((s,e)=>s+e.amount,0);
    const end=t.left-spentVar/d*rest;
    proj=`<div class="proj">${end>=0?`À ce rythme, tu finis le mois avec <b class="good num">+${eur(end)}</b>.`:`À ce rythme, il manquera <b class="bad num">${eur(-end)}</b> en fin de mois.`}</div>`;
    split=[['Dépensé',eur(t.done)],['À venir',eur(t.upOut+t.upSave)],['Par jour',t.left>0?eur(t.left/(rest+1)):'—']];
  }else if(st==='past')split=[['Dépensé',eur(t.expense)],['Épargné',eur(t.saving)],['Revenus',eur(t.income)]];
  else split=[['Fixes prévus',eur(t.fixed)],['Épargne prévue',eur(t.saving)],['Enveloppes',eur(bt)]];
  const bonus=m.incomes.filter(i=>i.sid&&i.sid!=='base').map(i=>i.label);
  out+=`<div class="hero">
    <span class="label">${st==='cur'?'Reste à vivre':st==='past'?'Il t’est resté':'Reste à vivre prévu'}</span>
    <span class="amount serif num" style="color:${t.left<0?'var(--bad)':'var(--ink)'}">${eur(t.left)}</span>
    <span class="sub">sur ${eur(t.income)} de revenus${bonus.length?' · dont '+esc(bonus[0]):''}${t.carry?` · report de ${eur(t.carry)}`:''}</span>
    <div class="pace"><div class="rail"><div class="fill" style="width:${Math.min(100,ratio*100)}%;background:${color}"></div>
      ${st==='cur'?`<div class="today" style="left:${dayR*100}%"></div>`:''}</div><div class="cap">${cap}</div></div>${proj}
    <div class="split">${split.map(([a,b])=>`<div><div class="k">${a}</div><div class="v num">${b}</div></div>`).join('')}</div></div>`;

  if(st!=='future')envCats.forEach(c=>{const b=envOf(m,c.id);if(!b)return;const s=varSpentOf(m,c.id),r=s/b;
    if(r>1)out+=`<div class="alert over"><span class="ico">⚠️</span><div><b>${esc(c.name)}</b> dépasse de ${eur(s-b)} — ${eur(s)} pour ${eur(b)} prévus.</div></div>`;
    else if(r>=D.settings.alert)out+=`<div class="alert"><span class="ico">⏳</span><div><b>${esc(c.name)}</b> à ${pct(r)} de son enveloppe, il reste ${eur(b-s)}. <button class="lnk" data-fiche="${c.id}">Voir</button></div></div>`;});

  const envRows=envCats.map(c=>{
    const b=envOf(m,c.id),s=varSpentOf(m,c.id),r=b?s/b:0,col=r>1?'var(--bad)':r>=D.settings.alert?'var(--warn)':'var(--good)';
    const kidLines=kids(c.id).filter(x=>varSpentOf(m,x.id)>0).map(x=>`<div class="sub"><span style="padding-left:2px">└ ${esc(x.name)}</span><span class="num">${eur(varSpentOf(m,x.id))}</span></div>`).join('');
    return `<button class="env" data-fiche="${c.id}"><div class="row1"><span>${c.emoji}</span><span class="nm">${esc(c.name)}</span>
        <span class="amt num">${eur(s)}${b?` <span class="muted">/ ${eur(b)}</span>`:''}</span></div>
      ${b?`<div class="rail"><div class="fill" style="width:${Math.min(100,r*100)}%;background:${col}"></div></div>`:''}
      <div class="sub"><span>${b?(s<=b?`Il reste ${eur(b-s)}`:`Dépassement de ${eur(s-b)}`):'Sans enveloppe'}</span><span>›</span></div>${kidLines}</button>`;
  }).join('');
  out+=`<section><div class="sechead"><h2>Enveloppes</h2><button data-tab="budget">Budget ›</button></div>
    ${envRows?`<div class="card">${envRows}</div>`:`<div class="empty">Aucune enveloppe pour l'instant. Fixe-les dans Budget.</div>`}</section>`;

  const items=monthItems(m),up=items.filter(o=>isLater(o.date)).sort((a,b)=>a.date.localeCompare(b.date));
  if(up.length){
    const so=up.filter(o=>o.kind==='out').reduce((s,o)=>s+o.amount,0),si=up.filter(o=>o.kind==='in').reduce((s,o)=>s+o.amount,0);
    out+=`<section><div class="sechead"><h2>À venir</h2><span class="tiny muted num">−${eur(so)}${si?' · +'+eur(si):''}</span></div>
      <div class="card">${up.map(opRow).join('')}</div></section>`;
  }
  const done=items.filter(o=>!isLater(o.date)).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  out+=`<section><div class="sechead"><h2>Dernières opérations</h2>${done.length>3?'<button data-tab="ops">Tout voir</button>':''}</div>
    ${done.length?`<div class="card">${done.slice(0,3).map(opRow).join('')}</div>`:'<div class="empty">Rien encore ce mois-ci. Touche le + pour commencer.</div>'}</section>`;
  return out;
}

/* Operations screen: everything that moved this month, incomes included,
   grouped by day, with search and filters. What is still to come sits on top. */
let filterCat='',opsQ='',opsType='all';
function viewOps(m){
  const q=opsQ.trim().toLowerCase();
  const pass=o=>(opsType==='all'||o.kind===opsType)
    &&(!filterCat||(o.kind==='out'&&(o.catId===filterCat||(catOf(o.catId)||{}).parent===filterCat)))
    &&(!q||(o.label||'').toLowerCase().includes(q)||String(o.amount).replace('.',',').includes(q));
  const items=monthItems(m).filter(pass);
  const up=items.filter(o=>isLater(o.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const done=items.filter(o=>!isLater(o.date)).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  const outSum=done.filter(o=>o.kind==='out').reduce((s,o)=>s+o.amount,0),inSum=done.filter(o=>o.kind==='in').reduce((s,o)=>s+o.amount,0);
  const used=roots().filter(c=>m.expenses.some(e=>(rootOf(e.catId)||{}).id===c.id));
  let html=`<div class="field"><input id="opsq" type="search" placeholder="Rechercher un libellé ou un montant" value="${esc(opsQ)}" autocomplete="off"></div>
    <div class="chips" style="margin-bottom:9px">${[['all','Tout'],['out','Dépenses'],['in','Revenus']].map(([v,l])=>`<button class="chip" data-ft="${v}" aria-pressed="${opsType===v}">${l}</button>`).join('')}</div>
    <div class="chips scroll" style="margin-bottom:14px"><button class="chip" data-fc="" aria-pressed="${!filterCat}">Toutes catégories</button>${
      used.map(c=>`<button class="chip" data-fc="${c.id}" aria-pressed="${filterCat===c.id}">${c.emoji} ${esc(c.name)}</button>`).join('')}</div>
    <div class="tile" style="margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <div><div class="k">${done.length} opération${done.length>1?'s':''}</div><div class="v serif num">${eur(outSum)}</div></div>
      ${inSum?`<div class="good num">+${eur(inSum)}</div>`:''}</div>`;
  if(up.length)html+=`<div class="daylabel">À venir</div><div class="card">${up.map(opRow).join('')}</div>`;
  let day='',buf='';
  done.forEach(o=>{if(o.date!==day){if(buf)html+=`<div class="card">${buf}</div>`;buf='';day=o.date;html+=`<div class="daylabel">${dayLabel(o.date)}</div>`}buf+=opRow(o)});
  if(buf)html+=`<div class="card">${buf}</div>`;
  if(!done.length&&!up.length)html+=`<div class="empty">${q||filterCat||opsType!=='all'?'Aucune opération ne correspond.':'Rien encore ce mois-ci.'}</div>`;
  return html;
}

/* Analysis screen. Month view: where the money goes and how it compares with
   the last three months. Year view: incomes against spending month by month,
   with the extra salary months standing out and the rest of the year shown as
   planned. */
function viewAnalyse(m){
  const seg=`<div class="seg" style="margin-bottom:14px"><button data-amode="mois" aria-pressed="${anaMode==='mois'}">Mois</button><button data-amode="annee" aria-pressed="${anaMode==='annee'}">Année</button></div>`;
  return seg+(anaMode==='annee'?viewYear():viewAnalyseMonth(m));
}
function viewAnalyseMonth(m){
  const t=totals(cur);
  const parts=roots().filter(c=>!c.save).map(c=>({c,s:spentOf(m,c.id),v:varSpentOf(m,c.id),b:envOf(m,c.id)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const max=Math.max(1,...parts.map(p=>p.s));
  const rows=parts.map(({c,s,v,b})=>{
    const right=b?(v>b?'+'+eur(v-b)+' vs enveloppe':eur(b-v)+' sous l’enveloppe'):(v?'pas d’enveloppe':'dépense fixe');
    return `<div class="env" style="cursor:default"><div class="row1"><span>${c.emoji}</span><span class="nm">${esc(c.name)}</span><span class="amt num">${eur(s)}</span></div>
      <div class="rail"><div class="fill" style="width:${s/max*100}%;background:${b&&v>b?'var(--bad)':'var(--good)'}"></div></div>
      <div class="sub"><span>${t.income?pct(s/t.income)+' des revenus':''}</span><span>${right}</span></div></div>`;
  }).join('');

  const prevs=[1,2,3].map(i=>D.months[shiftKey(cur,-i)]).filter(Boolean);
  let compare='';
  if(prevs.length){
    const diffs=roots().map(c=>{
      const avg=prevs.reduce((s,mm)=>s+spentOf(mm,c.id),0)/prevs.length;
      return {c,avg,now:spentOf(m,c.id),d:spentOf(m,c.id)-avg};
    }).filter(x=>Math.abs(x.d)>=5).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,5);
    compare=diffs.length?`<section><div class="sechead"><h2>Par rapport à d'habitude</h2></div><div class="card">${
      diffs.map(x=>`<div class="item"><span>${x.c.emoji}</span><span class="mid">${esc(x.c.name)}<span class="s">moyenne ${eur(x.avg)} sur ${prevs.length} mois</span></span>
      <span class="num ${x.d>0?'bad':'good'}">${x.d>0?'+':'−'}${eur(Math.abs(x.d))}</span></div>`).join('')}</div></section>`:'';
  }

  return `<div class="grid2" style="margin-bottom:16px">
      <div class="tile"><div class="k">Revenus</div><div class="v serif num">${eur(t.income)}</div></div>
      <div class="tile"><div class="k">Dépenses</div><div class="v serif num">${eur(t.expense)}</div></div>
      <div class="tile"><div class="k">Épargne</div><div class="v serif num">${eur(t.saving)}</div></div>
      <div class="tile"><div class="k">Reste à vivre</div><div class="v serif num" style="color:${t.left<0?'var(--bad)':'var(--good)'}">${eur(t.left)}</div></div>
    </div>
    <section><div class="sechead"><h2>Où part l'argent</h2>${monthState(cur)==='cur'?'<span class="tiny muted">à venir inclus</span>':''}</div>
      ${rows?`<div class="card">${rows}</div>`:`<div class="empty">Rien à analyser pour ce mois.</div>`}</section>
    ${compare}`;
}
function viewYear(){
  const Y=anaYear,tk=thisKey(),plan=planOf(),short=((SAL().bonusLabel||'').match(/^\d+ᵉ/)||['★'])[0];
  const yr=[];
  for(let mo=1;mo<=12;mo++){
    const k=Y+'-'+pad(mo),m=D.months[k],st=k<tk?'past':k===tk?'cur':'future';
    let inc=null,exp=null,bonus=false;
    if(st==='future'){inc=salaryLines(k).reduce((s,l)=>s+l.amount,0)+plan.regular;exp=plan.fixed+plan.env;bonus=salaryLines(k).some(l=>l.sid!=='base')}
    else if(m){const t=rawTotals(m);inc=t.income;exp=t.expense;bonus=m.incomes.some(i=>i.sid&&i.sid!=='base')}
    yr.push({k,mo,st,inc,exp,bonus,save:m?rawTotals(m).saving:0});
  }
  const top=Math.max(1000,...yr.map(r=>Math.max(r.inc||0,r.exp||0))),step=top<=4000?1000:top<=8000?2000:5000,max=Math.ceil(top/step)*step;
  const W=344,H=206,L=42,T=20,B=26,inner=H-T-B,bw=(W-L-4)/12,y=v=>T+inner*(1-v/max),f='font-family="Instrument Sans,system-ui,sans-serif"';
  let g='';
  for(let v=0;v<=max;v+=step)g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1" ${v?'stroke-dasharray="2 4"':''}/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--ink-3)" ${f}>${v?v/1000+' k€':'0'}</text>`;
  yr.forEach(r=>{
    const x0=L+(r.mo-1)*bw,w=bw*.36,fut=r.st==='future',dash=fut?'stroke-dasharray="3 3"':'';
    if(r.inc!=null)g+=`<rect x="${x0+bw*.12}" y="${y(r.inc)}" width="${w}" height="${Math.max(0,T+inner-y(r.inc))}" rx="2" style="fill:${fut?'none':'var(--surface-2)'};stroke:${fut?'var(--ink-3)':'var(--line)'}" ${dash}/>`;
    if(r.exp!=null)g+=`<rect x="${x0+bw*.52}" y="${y(r.exp)}" width="${w}" height="${Math.max(0,T+inner-y(r.exp))}" rx="2" style="fill:${fut?'none':'var(--good)'};stroke:${fut?'var(--good)':'none'}${r.st==='cur'?';fill-opacity:.75':''}" ${dash}/>`;
    if(r.bonus&&r.inc!=null)g+=`<text x="${x0+bw*.3}" y="${y(r.inc)-6}" text-anchor="middle" font-size="9.5" font-weight="600" style="fill:var(--warn)" ${f}>${esc(short)}</text>`;
    g+=`<text x="${x0+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" font-weight="${r.st==='cur'?700:400}" style="fill:${r.st==='cur'?'var(--ink)':'var(--ink-3)'}" ${f}>${'JFMAMJJASOND'[r.mo-1]}</text>`;
    g+=`<rect x="${x0}" y="${T}" width="${bw}" height="${inner+B}" style="fill:transparent;cursor:pointer" data-goto="${r.k}"><title>${capf(MONTHNAMES[r.mo-1])} : revenus ${eur(r.inc||0)}, dépenses ${eur(r.exp||0)}</title></rect>`;
  });
  const done=yr.filter(r=>r.st==='past'&&r.inc!=null);
  let stats='';
  if(done.length){
    const inc=done.reduce((s,r)=>s+r.inc,0),exp=done.reduce((s,r)=>s+r.exp,0),dear=done.reduce((a,r)=>r.exp>a.exp?r:a,done[0]);
    stats=`<div class="stat3"><div class="tile"><div class="k">Dépense moyenne</div><div class="v serif num">${eur(exp/done.length,0)}</div></div>
      <div class="tile"><div class="k">Taux d'épargne</div><div class="v serif num">${inc?pct((inc-exp)/inc):'—'}</div></div>
      <div class="tile"><div class="k">Mois le plus cher</div><div class="v serif">${capf(MONTHNAMES[dear.mo-1])}</div></div></div>`;
  }
  const s=SAL(),parts=(s.parts||[]).filter(p=>+p.amount);
  const tip=parts.length&&s.mode!=='lisse'?`<div class="tip"><b>Ton ${esc(s.bonusLabel||'13ᵉ mois')} tombe en ${frList(parts.map(p=>MONTHNAMES[+p.month-1]))}.</b>
      Ces mois-là rapportent plus que les autres. Pour un budget égal toute l'année, passe le salaire en « lissé sur 12 mois » : +${eur(bonusTotal(s)/12)} chaque mois, sans pic.
      <div><button class="btn small" data-tab="budget">Ouvrir Budget</button></div></div>`:'';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses de ${Y}, mois par mois">${g}</svg>
      <div class="leg"><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>Revenus</span><span><i style="background:var(--good)"></i>Dépenses</span><span><i style="border:1px dashed var(--ink-3)"></i>Prévu</span></div></div>
    <div class="tiny muted" style="margin:6px 2px 0">Touche un mois pour l'ouvrir.</div>${stats||'<div style="height:14px"></div>'}${tip}`;
}

const closeSheets=()=>document.querySelectorAll('.sheetwrap').forEach(x=>x.remove());
function sheet(title,body,onMount,noFocus){
  closeSheets();
  const w=el(`<div class="sheetwrap"><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><h2>${title}</h2>${body}</div></div>`);
  w.addEventListener('click',e=>{if(e.target===w)w.remove()});
  document.body.appendChild(w);
  onMount&&onMount(w);
  const f=!noFocus&&w.querySelector('input,select');if(f)setTimeout(()=>f.focus(),60);
  return w;
}
/* Deleting or adding never asks for confirmation: a message offers to undo it
   for a few seconds instead. */
let toastTimer;
function toast(msg,undo){
  document.querySelectorAll('.toast').forEach(x=>x.remove());clearTimeout(toastTimer);
  const t=el(`<div class="toast${undo?' undo':''}"><span>${msg}</span>${undo?'<button type="button">Annuler</button>':''}</div>`);
  if(undo)t.querySelector('button').onclick=()=>{t.remove();undo()};
  document.body.appendChild(t);toastTimer=setTimeout(()=>t.remove(),undo?4500:2200);
}

/* Adding: one sheet for an expense or an income. Frequent expenses appear as
   favourites added in one tap, and a known label brings back its category. */
function pastExpenses(){return Object.keys(D.months).sort().flatMap(k=>D.months[k].expenses).filter(e=>!e.rid&&e.label&&e.date<=todayISO())}
function favorites(){
  const d=new Date(Date.now()-92*864e5),from=keyOf(d)+'-'+pad(d.getDate()),map=new Map();
  pastExpenses().filter(e=>e.date>=from).forEach(e=>{
    const k=e.label.toLowerCase()+'|'+e.amount,f=map.get(k)||{label:e.label,amount:e.amount,catId:e.catId,n:0,last:''};
    f.n++;if(e.date>=f.last){f.last=e.date;f.catId=e.catId}map.set(k,f)});
  return [...map.values()].filter(f=>f.n>=2&&catOf(f.catId)).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,4);
}
function knownLabels(){const map=new Map();pastExpenses().forEach(e=>{if(catOf(e.catId))map.set(e.label,e.catId)});return [...map]}
function addEntry(kind,o){
  const mk=o.date.slice(0,7),tm=ensureMonth(mk);
  if(tm.closed){toast(capf(monthName(mk))+' est clôturé');return null}
  const item={id:uid(),...o};(kind==='in'?tm.incomes:tm.expenses).push(item);save();render();
  const where=mk!==cur?' en '+monthName(mk):'';
  return {item,where,undo:()=>{const arr=kind==='in'?tm.incomes:tm.expenses,i=arr.indexOf(item);if(i>=0)arr.splice(i,1);save();render()}};
}

function salarySheet(){
  const s=SAL();
  const st={net:+s.net||0,months:+s.months||12,mode:s.mode||'reel',label:s.bonusLabel||'13ᵉ mois',
    parts:(s.parts||[]).map(p=>({month:+p.month,amount:+p.amount||0})),custom:false};
  if(st.months>12&&!st.parts.length)st.parts=[{month:6,amount:0},{month:11,amount:0}];
  if(st.months<=12&&st.parts.length)st.months=13;

  const dec=v=>v?String(v).replace('.',','):'';
  sheet('Salaire',`
    <div class="field"><label for="net">Net mensuel</label>
      <input class="bigamount num" id="net" inputmode="decimal" placeholder="0,00" value="${dec(st.net)}"></div>
    <div class="field"><label for="pd">Versé le</label><input id="pd" class="num" inputmode="numeric" value="${s.payDay||28}" placeholder="28"></div>
    <div class="field"><label>Combien de mois par an ?</label><div class="chips" id="nb"></div></div>
    <div id="dyn"></div>
    <div class="tile" id="tot" style="margin:16px 0 14px"></div>
    <button class="btn primary" id="ok">Enregistrer</button>
    <div class="tiny muted" style="margin-top:12px">S'applique à partir de ${labelOf(thisKey())} ; les mois passés gardent le salaire réellement perçu. Pour une variation exceptionnelle (heures supplémentaires, prime), ajoute plutôt un revenu à part.</div>`,
  w=>{
    const q=s=>w.querySelector(s);
    const readNet=()=>{st.net=num(q('#net').value)};
    const readParts=()=>{
      w.querySelectorAll('.pamt').forEach(i=>{
        const p=st.parts.find(x=>x.month===+i.dataset.m);if(p)p.amount=num(i.value)});
      const l=q('#blab');if(l)st.label=l.value;
    };
    /* Extra months are split evenly across the payment months until an amount
       is typed by hand. */
    const spread=()=>{
      if(st.custom||st.months<=12)return;
      const extra=r2(st.net*(st.months-12)),n=st.parts.length||1;
      st.parts.forEach(p=>p.amount=r2(extra/n));
    };
    const total=()=>{
      const bt=st.parts.reduce((a,p)=>a+p.amount,0),yr=r2(st.net*12+(st.months>12?bt:0));
      q('#tot').innerHTML=`<div class="k">Total annuel net</div><div class="v serif num">${eur(yr)}</div>
        <div class="tiny muted" style="margin-top:3px">soit ${eur(yr/12)} par mois en moyenne${st.months>12&&bt?` · dont ${eur(bt)} de mois supplémentaires`:''}</div>`;
    };
    function draw(){
      q('#nb').innerHTML=[12,13,14].map(n=>`<button type="button" class="chip" data-nb="${n}" aria-pressed="${st.months===n}">${n} mois</button>`).join('');
      st.parts.sort((a,b)=>a.month-b.month);
      q('#dyn').innerHTML=st.months<=12?'':`
        <div class="field"><label>Versé en</label><div class="chips">${
          MONTHSHORT.map((nm,i)=>`<button type="button" class="chip sm" data-mo="${i+1}" aria-pressed="${st.parts.some(p=>p.month===i+1)}" aria-label="${MONTHNAMES[i]}">${nm}</button>`).join('')}</div>
          <div class="tiny muted" style="margin-top:7px">Touche un mois pour l'ajouter ou l'enlever : le complément peut tomber sur n'importe quels mois, en une ou plusieurs fois, et chaque montant reste modifiable.</div></div>
        <div class="field"><label for="blab">Nom du complément</label>
          <input id="blab" value="${esc(st.label)}" placeholder="13ᵉ mois, prime de vacances…"></div>
        ${st.parts.map(p=>`<div class="field"><label for="pa${p.month}">Versé en ${MONTHNAMES[p.month-1]}</label>
          <input id="pa${p.month}" class="num pamt" data-m="${p.month}" inputmode="decimal" value="${dec(p.amount)}"></div>`).join('')}
        <div class="field"><label>Dans le budget mensuel</label><div class="chips">
          <button type="button" class="chip" data-md="reel" aria-pressed="${st.mode==='reel'}">Aux mois réels</button>
          <button type="button" class="chip" data-md="lisse" aria-pressed="${st.mode==='lisse'}">Lissé sur 12 mois</button></div>
          <div class="tiny muted" style="margin-top:7px">${st.mode==='reel'
            ?'Le complément apparaît comme revenu en '+(frList(st.parts.map(p=>MONTHNAMES[p.month-1]))||'les mois choisis')+', où le reste à vivre sera donc plus élevé.'
            :'Un douzième est ajouté chaque mois : le budget reste stable toute l\'année, mais les versements réels n\'apparaissent plus tels quels.'}</div></div>`;
      wire();total();
    }
    function wire(){
      w.querySelectorAll('[data-nb]').forEach(b=>b.onclick=()=>{
        readNet();readParts();st.months=+b.dataset.nb;st.custom=false;
        if(st.months>12&&!st.parts.length)st.parts=[{month:6,amount:0},{month:11,amount:0}];
        spread();draw();});
      w.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{
        readNet();readParts();const mo=+b.dataset.mo;
        const i=st.parts.findIndex(p=>p.month===mo);
        if(i>=0){if(st.parts.length>1)st.parts.splice(i,1)}else st.parts.push({month:mo,amount:0});
        spread();draw();});
      w.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{readNet();readParts();st.mode=b.dataset.md;draw()});
      w.querySelectorAll('.pamt').forEach(i=>i.oninput=()=>{st.custom=true;readParts();total()});
    }
    q('#net').oninput=()=>{
      readNet();
      if(!st.custom){spread();w.querySelectorAll('.pamt').forEach(i=>{
        const p=st.parts.find(x=>x.month===+i.dataset.m);if(p)i.value=dec(p.amount)})}
      total();
    };
    q('#ok').onclick=()=>{
      readNet();readParts();
      Object.assign(SAL(),{net:r2(st.net),months:st.months,mode:st.mode,
        payDay:Math.min(31,Math.max(1,Math.round(num(q('#pd').value))||28)),
        bonusLabel:st.label.trim()||'13ᵉ mois',
        parts:st.months>12?st.parts.filter(p=>p.amount>0).map(p=>({month:p.month,amount:r2(p.amount)})):[]});
      syncSalaryForward();save();w.remove();render();toast('Salaire enregistré');
    };
    draw();
  });
}

      if(c){Object.assign(c,o);tid=c.id}else{tid=uid();D.categories.push({id:tid,budget:null,...o})}
      const b=bv===''?null:+num(bv).toFixed(2);
      catOf(tid).budget=b;
      Object.keys(D.months).filter(k=>k>=thisKey()&&!D.months[k].closed).forEach(k=>{
        if(b===null)delete D.months[k].budgets[tid];else D.months[k].budgets[tid]=b;});

    };
